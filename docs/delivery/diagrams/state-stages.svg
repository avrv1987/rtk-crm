<text x="24.0" y="49.0" font-size="11" text-anchor="start" fill="#616e7c"><tspan x="24.0" dy="0">Базовый шаблон из миграции V8: 13 этапов, 25 переходов. Тёмная стрелка — вперёд на соседний этап,</tspan><tspan x="24.0" dy="14">светлая — возврат на один этап, без комментария; пунктир — необязательный этап (5. Корректировка</tspan><tspan x="24.0" dy="14">документов). Правка этапов карточки меняет только её граф.</tspan></text>
