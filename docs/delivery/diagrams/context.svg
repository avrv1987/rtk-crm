<rect x="563.4" y="289.0" width="123.2" height="29.0" fill="#ffffff"/>
<text x="625.0" y="300.0" font-size="10" text-anchor="middle" fill="#1f2933"><tspan x="625.0" dy="0">вход OIDC; блокировка</tspan><tspan x="625.0" dy="13">учётных записей</tspan></text>
