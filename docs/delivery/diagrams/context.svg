<g stroke="#1f2933" stroke-width="1.4" fill="none"><circle cx="89.0" cy="456.0" r="7" fill="#ffffff"/><line x1="89.0" y1="463.0" x2="89.0" y2="476.0"/><line x1="78.0" y1="467.0" x2="100.0" y2="467.0"/><line x1="89.0" y1="476.0" x2="80.0" y2="486.0"/><line x1="89.0" y1="476.0" x2="98.0" y2="486.0"/></g>
<text x="89.0" y="502.0" font-size="12" text-anchor="middle" fill="#1f2933"><tspan x="89.0" dy="0">Оператор</tspan><tspan x="89.0" dy="15">зачисления (флаг у</tspan><tspan x="89.0" dy="15">USER или LEADER)</tspan></text>
<rect x="300.0" y="200.0" width="250.0" height="230.0" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<g stroke="#1f2933" stroke-width="1" fill="#ffffff"><rect x="530.0" y="206.0" width="13" height="15"/><rect x="526.0" y="209.0" width="8" height="3"/><rect x="526.0" y="215.0" width="8" height="3"/></g>
<text x="425.0" y="218.0" font-size="10" text-anchor="middle" fill="#616e7c"><tspan x="425.0" dy="0">«система»</tspan></text>
<text x="425.0" y="234.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="425.0" dy="0">CRM ИТ Школы РТК</tspan></text>
<text x="425.0" y="252.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="425.0" dy="0">организации и контакты, маршрут</tspan><tspan x="425.0" dy="14">взаимодействия, документы,</tspan><tspan x="425.0" dy="14">соглашения, отчёты, данные сайта и</tspan><tspan x="425.0" dy="14">LMS, модуль «Слушатели», журнал,</tspan><tspan x="425.0" dy="14">функции субъекта ПДн</tspan></text>
<rect x="700.0" y="70.0" width="210.0" height="93.0" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="805.0" y="88.0" font-size="10" text-anchor="middle" fill="#616e7c"><tspan x="805.0" dy="0">«внешняя система»</tspan></text>
<text x="805.0" y="104.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="bold"><tspan x="805.0" dy="0">Почтовый сервер</tspan></text>
<text x="805.0" y="122.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="805.0" dy="0">не используется: напоминания</tspan><tspan x="805.0" dy="14">показываются в интерфейсе,</tspan><tspan x="805.0" dy="14">писем CRM не отправляет</tspan></text>
<rect x="700.0" y="176.0" width="210.0" height="78.0" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="805.0" y="194.0" font-size="10" text-anchor="middle" fill="#616e7c"><tspan x="805.0" dy="0">«внешняя система»</tspan></text>
<text x="805.0" y="210.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="805.0" dy="0">Сайт ИТ Школы РТК</tspan></text>
<text x="805.0" y="228.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="805.0" dy="0">заявки вузов и на обучение,</tspan><tspan x="805.0" dy="14">оплаты</tspan></text>
<rect x="700.0" y="260.0" width="210.0" height="86.0" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="805.0" y="278.0" font-size="10" text-anchor="middle" fill="#616e7c"><tspan x="805.0" dy="0">«внешняя система»</tspan></text>
<text x="805.0" y="294.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="805.0" dy="0">IdP: Keycloak из поставки или</tspan><tspan x="805.0" dy="15">IdP заказчика</tspan></text>
<text x="805.0" y="327.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="805.0" dy="0">учётные записи и вход</tspan></text>
<rect x="700.0" y="356.0" width="210.0" height="78.0" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="805.0" y="374.0" font-size="10" text-anchor="middle" fill="#616e7c"><tspan x="805.0" dy="0">«внешняя система»</tspan></text>
<text x="805.0" y="390.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="805.0" dy="0">LMS заказчика (Moodle)</tspan></text>
<text x="805.0" y="408.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="805.0" dy="0">курсы, группы, участники,</tspan><tspan x="805.0" dy="14">завершение</tspan></text>
