<text x="447.0" y="553.5" font-size="10" text-anchor="middle" fill="#1f2933"><tspan x="447.0" dy="0">файл «Загрузка пользователей» переносится в LMS вручную</tspan></text>
<g stroke="#1f2933" stroke-width="1.4" fill="none"><circle cx="89.0" cy="88.0" r="7" fill="#ffffff"/><line x1="89.0" y1="95.0" x2="89.0" y2="108.0"/><line x1="78.0" y1="99.0" x2="100.0" y2="99.0"/><line x1="89.0" y1="108.0" x2="80.0" y2="118.0"/><line x1="89.0" y1="108.0" x2="98.0" y2="118.0"/></g>
