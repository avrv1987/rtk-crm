<g stroke="#1f2933" stroke-width="1.4" fill="none"><circle cx="89.0" cy="272.0" r="7" fill="#ffffff"/><line x1="89.0" y1="279.0" x2="89.0" y2="292.0"/><line x1="78.0" y1="283.0" x2="100.0" y2="283.0"/><line x1="89.0" y1="292.0" x2="80.0" y2="302.0"/><line x1="89.0" y1="292.0" x2="98.0" y2="302.0"/></g>
<text x="89.0" y="318.0" font-size="12" text-anchor="middle" fill="#1f2933"><tspan x="89.0" dy="0">Руководство</tspan><tspan x="89.0" dy="15">(MANAGEMENT)</tspan></text>
<g stroke="#1f2933" stroke-width="1.4" fill="none"><circle cx="89.0" cy="364.0" r="7" fill="#ffffff"/><line x1="89.0" y1="371.0" x2="89.0" y2="384.0"/><line x1="78.0" y1="375.0" x2="100.0" y2="375.0"/><line x1="89.0" y1="384.0" x2="80.0" y2="394.0"/><line x1="89.0" y1="384.0" x2="98.0" y2="394.0"/></g>
