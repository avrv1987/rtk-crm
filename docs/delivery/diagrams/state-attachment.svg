<text x="116.0" y="267.5" font-size="10" text-anchor="start" fill="#1f2933"><tspan x="116.0" dy="0">[OK]</tspan></text>
<rect x="261.6" y="256.5" width="50.4" height="16.0" fill="#ffffff"/>
<text x="309.0" y="267.5" font-size="10" text-anchor="end" fill="#1f2933"><tspan x="309.0" dy="0">[FOUND]</tspan></text>
<rect x="388.8" y="237.0" width="128.2" height="55.0" fill="#ffffff"/>
<text x="514.0" y="248.0" font-size="10" text-anchor="end" fill="#1f2933"><tspan x="514.0" dy="0">[зашифрованный архив,</tspan><tspan x="514.0" dy="13">превышение пределов,</tspan><tspan x="514.0" dy="13">ClamAV недоступен или</tspan><tspan x="514.0" dy="13">тайм-аут]</tspan></text>
<circle cx="315.0" cy="95.0" r="8" fill="#1f2933"/>
<rect x="225.0" y="144.0" width="180.0" height="56.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="315.0" y="164.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="315.0" dy="0">QUARANTINE</tspan></text>
<text x="315.0" y="182.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="315.0" dy="0">файл сохранён, проверка</tspan><tspan x="315.0" dy="14">ClamAV</tspan></text>
<rect x="20.0" y="294.0" width="180.0" height="56.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="110.0" y="314.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="110.0" dy="0">CLEAN</tspan></text>
<text x="110.0" y="332.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="110.0" dy="0">скачивание и просмотр</tspan><tspan x="110.0" dy="14">доступны</tspan></text>
<rect x="225.0" y="294.0" width="180.0" height="56.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="315.0" y="314.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="315.0" dy="0">REJECTED</tspan></text>
<text x="315.0" y="332.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="315.0" dy="0">файл удалён с диска; не</tspan><tspan x="315.0" dy="14">выдаётся</tspan></text>
<rect x="430.0" y="294.0" width="180.0" height="56.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
