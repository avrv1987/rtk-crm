<text x="24.0" y="49.0" font-size="11" text-anchor="start" fill="#616e7c"><tspan x="24.0" dy="0">attachments.status. Переход из QUARANTINE выполняется в том же запросе загрузки. Удаление —</tspan><tspan x="24.0" dy="14">отметка deleted_at, статус не меняется.</tspan></text>
