<text x="488.0" y="780.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold"><tspan x="488.0" dy="0">Контроль</tspan></text>
<text x="488.0" y="798.0" font-size="11" text-anchor="start" fill="#1f2933"><tspan x="488.0" dy="0">Карточка без движения дольше 30 дней — «застряла». Отметки:</tspan><tspan x="488.0" dy="14">ожидание вуза или РТК, проблема, риск. Статус работы:</tspan><tspan x="488.0" dy="14">приостановить или завершить с причиной. Напоминания: срок шага</tspan><tspan x="488.0" dy="14">(7 дней вперёд), окончание лицензии за 1 год, цикл обучения раз в 3</tspan><tspan x="488.0" dy="14">года с предупреждением за 90 дней.</tspan></text>
</svg>
