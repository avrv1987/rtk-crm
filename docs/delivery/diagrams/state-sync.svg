<text x="115.0" y="182.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="115.0" dy="0">в очереди</tspan><tspan x="115.0" dy="14">SourceSyncExecutor</tspan></text>
<rect x="30.0" y="294.0" width="170.0" height="56.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
