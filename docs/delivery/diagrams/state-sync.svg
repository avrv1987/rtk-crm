<text x="24.0" y="49.0" font-size="11" text-anchor="start" fill="#616e7c"><tspan x="24.0" dy="0">sync_runs.status; у источника одновременно не больше одного запуска в PENDING или RUNNING</tspan><tspan x="24.0" dy="14">(уникальный индекс).</tspan></text>
