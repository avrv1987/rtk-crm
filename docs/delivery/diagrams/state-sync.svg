<rect x="120.0" y="117.5" width="77.9" height="16.0" fill="#ffffff"/>
<text x="123.0" y="128.5" font-size="10" text-anchor="start" fill="#1f2933"><tspan x="123.0" dy="0">запрос принят</tspan></text>
<rect x="240.4" y="133.5" width="249.2" height="16.0" fill="#ffffff"/>
<text x="365.0" y="144.5" font-size="10" text-anchor="middle" fill="#1f2933"><tspan x="365.0" dy="0">исполнитель занят: запуск удаляется, ответ 503</tspan></text>
<rect x="120.0" y="239.5" width="140.6" height="16.0" fill="#ffffff"/>
