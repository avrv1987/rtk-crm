<rect x="10.0" y="444.0" width="210.0" height="84.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="115.0" y="464.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="115.0" dy="0">SUCCEEDED</tspan></text>
<text x="115.0" y="482.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="115.0" dy="0">счётчики; метка updated_since</tspan><tspan x="115.0" dy="14">сайта сдвигается</tspan></text>
<rect x="360.0" y="444.0" width="210.0" height="84.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="465.0" y="464.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="465.0" dy="0">FAILED</tspan></text>
<text x="465.0" y="482.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="465.0" dy="0">error_code: SOURCE_*,</tspan><tspan x="465.0" dy="14">SYNC_INTERRUPTED,</tspan><tspan x="465.0" dy="14">SYNC_FAILED</tspan></text>
<circle cx="540.0" cy="155.0" r="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/><circle cx="540.0" cy="155.0" r="6" fill="#1f2933"/>
