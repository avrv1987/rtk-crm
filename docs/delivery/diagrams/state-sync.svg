<rect x="120.0" y="389.5" width="85.8" height="16.0" fill="#ffffff"/>
<text x="123.0" y="400.5" font-size="10" text-anchor="start" fill="#1f2933"><tspan x="123.0" dy="0">результат готов</tspan></text>
<rect x="260.9" y="304.5" width="143.2" height="16.0" fill="#ffffff"/>
<text x="332.5" y="315.5" font-size="10" text-anchor="middle" fill="#1f2933"><tspan x="332.5" dy="0">ошибка: код в поле ошибки</tspan></text>
<rect x="416.7" y="249.4" width="118.8" height="29.0" fill="#ffffff"/>
<text x="532.5" y="260.4" font-size="10" text-anchor="end" fill="#1f2933"><tspan x="532.5" dy="0">перезапуск backend:</tspan><tspan x="532.5" dy="13">SYNC_INTERRUPTED</tspan></text>
<circle cx="115.0" cy="95.0" r="8" fill="#1f2933"/>
<rect x="30.0" y="144.0" width="170.0" height="56.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
