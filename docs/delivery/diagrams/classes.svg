<text x="24.0" y="49.0" font-size="11" text-anchor="start" fill="#616e7c"><tspan x="24.0" dy="0">Записи Java (record) из пакетов ru.rtk.crm.*, основные поля. Стрелка ведёт к классу, на который ссылается поле; у стрелки — кратность со стороны источника; ◆ — часть</tspan><tspan x="24.0" dy="14">целого; «копия» — этапы шаблона копируются в карточку при создании.</tspan></text>
