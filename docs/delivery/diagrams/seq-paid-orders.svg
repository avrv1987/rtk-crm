<text x="542.1" y="1100.0" font-size="11" text-anchor="middle" fill="#1f2933"><tspan x="542.1" dy="0">SUCCEEDED и счётчики;</tspan><tspan x="542.1" dy="14">сдвиг updated_since;</tspan><tspan x="542.1" dy="14">журнал</tspan><tspan x="542.1" dy="14">LEARNERS_SYNCED</tspan></text>
