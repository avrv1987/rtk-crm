<text x="152.7" y="1175.0" font-size="11" text-anchor="start" fill="#1f2933"><tspan x="152.7" dy="0">Ошибка откатывает и запись источника, и</tspan><tspan x="152.7" dy="14">зачисление. При выключенном модуле ФИО,</tspan><tspan x="152.7" dy="14">телефон и email отбрасываются.</tspan></text>
