<polygon points="320.5,464.0 325.0,474.0 329.5,464.0" fill="#52606d" stroke="#52606d" stroke-width="1.2"/>
<rect x="130.0" y="117.5" width="155.6" height="16.0" fill="#ffffff"/>
<text x="133.0" y="128.5" font-size="10" text-anchor="start" fill="#1f2933"><tspan x="133.0" dy="0">оплата или загрузка шаблона</tspan></text>
<rect x="242.4" y="141.1" width="145.3" height="29.0" fill="#ffffff"/>
<text x="315.0" y="152.1" font-size="10" text-anchor="middle" fill="#1f2933"><tspan x="315.0" dy="0">администратор: ограничить</tspan><tspan x="315.0" dy="13">обработку</tspan></text>
<rect x="223.3" y="209.4" width="183.5" height="16.0" fill="#ffffff"/>
<text x="315.0" y="220.4" font-size="10" text-anchor="middle" fill="#1f2933"><tspan x="315.0" dy="0">администратор: снять ограничение</tspan></text>
<rect x="128.0" y="280.0" width="132.4" height="55.0" fill="#ffffff"/>
<text x="131.0" y="291.0" font-size="10" text-anchor="start" fill="#1f2933"><tspan x="131.0" dy="0">администратор:</tspan><tspan x="131.0" dy="13">обезличивание, или срок</tspan><tspan x="131.0" dy="13">хранения P3Y после</tspan><tspan x="131.0" dy="13">окончания потоков</tspan></text>
<rect x="508.0" y="293.0" width="104.5" height="29.0" fill="#ffffff"/>
<text x="511.0" y="304.0" font-size="10" text-anchor="start" fill="#1f2933"><tspan x="511.0" dy="0">администратор или</tspan><tspan x="511.0" dy="13">срок хранения</tspan></text>
<rect x="330.0" y="437.0" width="177.6" height="29.0" fill="#ffffff"/>
<text x="333.0" y="448.0" font-size="10" text-anchor="start" fill="#1f2933"><tspan x="333.0" dy="0">дальше не изменяется: 409</tspan><tspan x="333.0" dy="13">PERSONAL_DATA_ANONYMIZED</tspan></text>
<circle cx="125.0" cy="95.0" r="8" fill="#1f2933"/>
<rect x="40.0" y="144.0" width="170.0" height="84.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="125.0" y="164.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="125.0" dy="0">ACTIVE</tspan></text>
<text x="125.0" y="182.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="125.0" dy="0">«действующая»: поля</tspan><tspan x="125.0" dy="14">зашифрованы, поиск по</tspan><tspan x="125.0" dy="14">отпечаткам</tspan></text>
<rect x="420.0" y="144.0" width="170.0" height="84.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="505.0" y="164.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="505.0" dy="0">RESTRICTED</tspan></text>
<text x="505.0" y="182.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="505.0" dy="0">«ограничена»: просмотр и</tspan><tspan x="505.0" dy="14">правка отвечают 409</tspan></text>
<rect x="230.0" y="344.0" width="190.0" height="84.0" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<text x="325.0" y="364.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"><tspan x="325.0" dy="0">ANONYMIZED</tspan></text>
<text x="325.0" y="382.0" font-size="11" text-anchor="middle" fill="#616e7c"><tspan x="325.0" dy="0">«обезличена»: шифротексты и</tspan><tspan x="325.0" dy="14">отпечатки удалены;</tspan><tspan x="325.0" dy="14">зачисления сохраняются</tspan></text>
<circle cx="325.0" cy="485.0" r="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/><circle cx="325.0" cy="485.0" r="6" fill="#1f2933"/>
