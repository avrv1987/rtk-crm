<text x="24.0" y="49.0" font-size="11" text-anchor="start" fill="#616e7c"><tspan x="24.0" dy="0">learners.personal_data_status; ограничение CHECK learners_profile_state требует пустых шифротекстов и</tspan><tspan x="24.0" dy="14">отпечатков у обезличенной анкеты.</tspan></text>
