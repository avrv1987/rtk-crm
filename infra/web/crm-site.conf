server_tokens off;

client_max_body_size 21m;
error_page 413 = @payload_too_large;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json application/yaml image/svg+xml;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $crm_forwarded_for;
proxy_set_header X-Forwarded-Proto $crm_forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header Forwarded "";

root /usr/share/nginx/html;

location = /healthz {
    return 200 "ok";
}

location ~ ^/(api/|swagger-ui|v3/api-docs|openapi\.yaml$) {
    proxy_pass http://backend:8080;
}

# MCP для ИИ-агентов (docs/mcp.md). При выключенном флаге backend отвечает 404. Буфер выключен: ответ может прийти
# потоком SSE.
location = /mcp {
    proxy_pass http://backend:8080;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location ^~ /.well-known/oauth-protected-resource {
    proxy_pass http://backend:8080;
}

location /idp/ {
    proxy_pass http://keycloak:8080/;
}

location @payload_too_large {
    include /etc/nginx/security-headers.conf;
    default_type "application/json; charset=utf-8";
    return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Размер запроса превышает допустимый: не более 20 МБ на файл","requestId":"$crm_request_uuid"}';
}

location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000";
    try_files $uri =404;
}

# Мини-приложение MAX: свой набор заголовков (мост с st.max.ru и встраивание в веб-версию MAX), остальная CRM
# остаётся с frame-ancestors 'none'. Маршрутизация внутри приложения в памяти: MAX кладёт WebAppData во фрагмент «#».
location ^~ /max/ {
    if ($crm_max_enabled = 0) {
        return 404;
    }
    include /etc/nginx/security-headers-max.conf;
    add_header Cache-Control "no-cache";
    try_files /max.html =404;
}

location = /max.html {
    return 404;
}

location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
}

location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
