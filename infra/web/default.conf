geo $crm_trusted_proxy {
    default 0;
    ${TRUSTED_PROXY_CIDR} 1;
}

map $crm_trusted_proxy $crm_forwarded_for {
    default $remote_addr;
    1 $proxy_add_x_forwarded_for;
}

map "$crm_trusted_proxy:$http_x_forwarded_proto" $crm_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

map $request_id $crm_request_uuid {
    "~^(?<a>.{8})(?<b>.{4})(?<c>.{4})(?<d>.{4})(?<e>.{12})$" "$a-$b-$c-$d-$e";
}

server {
    listen 8080;
    server_name _;

    include /etc/nginx/crm-site.conf;
}
