geo $crm_trusted_proxy {
    default 0;
    ${TRUSTED_PROXY_CIDR} 1;
}

map $crm_trusted_proxy $crm_forwarded_for {
    default $remote_addr;
    1 $proxy_add_x_forwarded_for;
}

map "$crm_trusted_proxy:$http_x_forwarded_proto" $crm_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

map $request_id $crm_request_uuid {
    "~^(?<a>.{8})(?<b>.{4})(?<c>.{4})(?<d>.{4})(?<e>.{12})$" "$a-$b-$c-$d-$e";
}

server {
    listen 8080;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:crm_tls:10m;

    location ^~ /idp/admin/ {
        return 404;
    }

    location ^~ /idp/realms/master/ {
        return 404;
    }

    include /etc/nginx/crm-site.conf;
}
