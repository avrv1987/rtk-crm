  /api/interactions/{id}/learning-snapshots/sync:
    post:
      tags: [Interaction]
      summary: Обновить данные LMS карточки
      operationId: refreshInteractionLearningSnapshots
      x-implementation-stage: 4
      description: >
        USER или LEADER области взаимодействия. Читает из Moodle только курсы, уже разрешённые администратором для
        организации и программы взаимодействия, и применяет только курсы и группы, сопоставленные этой паре, в потоке
        запроса и по тому же правилу «один активный запуск», что и синхронизация администратора. Токен Moodle остаётся
        на сервере. Изменившийся снимок добавляет событие «Данные LMS» от имени вызвавшего; неизменившиеся получают
        только новое время наблюдения. Ошибка Moodle сохраняет последнюю полную публикацию и возвращает 502 LMS_SYNC_FAILED.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Завершённый запуск в рамках области и обновлённые снимки взаимодействия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSnapshotsRefresh'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            LMS_NOT_MAPPED, если у взаимодействия нет программы или ни один разрешённый курс или группа Moodle не сопоставлены его организации и программе; SOURCE_NOT_CONFIGURED; SYNC_ALREADY_RUNNING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: LMS_SYNC_FAILED — Moodle был недоступен или отклонил запрос; сохранённые снимки не изменились
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
