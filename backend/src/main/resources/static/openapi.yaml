      x-implementation-stage: 4
      description: >
        ADMIN only. WEBSITE is the adapter of the proposed site contract (docs/integrations/site-api.yaml), not a
        confirmed API of the customer; MOODLE reads aggregated course and group data through a restricted Moodle web
        service (docs/integrations.md). Base URL, token and the allowed course list come only from the deployment
        configuration and are never returned.
      responses:
        '200':
          description: Sources with configuration flag, last run with counters, last success and number of records to review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/sources/{source}/sync:
    post:
      tags: [Administration]
      summary: Запустить синхронизацию источника
      operationId: startSourceSync
      x-implementation-stage: 4
      description: >
        ADMIN only. Persists a PENDING run and hands it to the bounded sync executor (not the HTTP thread); returns 202
        with runId. Only one PENDING or RUNNING run per source exists: a second start gets 409 SYNC_ALREADY_RUNNING.
        Repeating a sync is safe: a site record with the same source, type, externalId and updatedAt is skipped, and a
        Moodle snapshot with unchanged counts only gets a new observation time. A source error fails the run and leaves
        stored records, published Moodle snapshots, demand numbers and the updated_since watermark intact.
        The same runs are started by the server schedule SOURCES_SYNC_CRON on behalf of the active administrator who
        started the latest run of the source; a source nobody started yet is not scheduled.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SourceCode'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Sync run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >
            SOURCE_NOT_CONFIGURED when SITE_BASE_URL is empty, or MOODLE_BASE_URL, MOODLE_TOKEN or MOODLE_COURSE_IDS is
            empty; SYNC_ALREADY_RUNNING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: SYNC_CAPACITY_EXCEEDED, the sync executor and its queue are busy; nothing was stored
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/source-records:
    get:
      tags: [Administration]
      summary: Записи источников для разбора
      operationId: listSourceProblemRecords
      x-implementation-stage: 4
      description: ADMIN only. Up to 200 latest records with status NEEDS_MAPPING or FAILED
      responses:
        '200':
          description: Records that need an organization or program mapping, or failed to apply
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/source-mapping-options:
    get:
      tags: [Administration]
      summary: Вузы и программы для сопоставления
      operationId: listSourceMappingOptions
      x-implementation-stage: 4
      responses:
        '200':
          description: All organizations and active programs an administrator can map an external reference to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMappingOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/source-records/{id}/apply:
    post:
      tags: [Administration]
      summary: Сопоставить и применить запись источника
      operationId: applySourceRecord
      x-implementation-stage: 4
      description: >
        ADMIN only. For a WEBSITE record saves the optional organization mapping (for the record's external
        organization ID, or its name when the ID is absent) and program mapping (for the program name). For a MOODLE
        NEEDS_MAPPING course or group record organizationId, programId, runStartsOn and runEndsOn are required: the
        mapping confirms a training run [runStartsOn, runEndsOn); a FAILED MOODLE record without them is applied again
        with its saved mapping. A run that ended before its first observation is SKIPPED without a snapshot, a run that
        has ended keeps its last observation. A group cannot be mapped when its course is mapped as a whole and vice
        versa (400). Then applies the stored record again and re-applies up to
        500 other NEEDS_MAPPING records of the same source. Applying an APPLIED or SKIPPED record changes nothing, so
        a repeated request is safe.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRecordApply'
      responses:
        '200':
          description: Record after the new attempt and the number of other records applied thanks to the mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRecordApplyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/imports/inspect:
    post:
      tags: [Catalog]
      summary: Прочитать листы и заголовки файла импорта
      operationId: inspectCatalogImport
      x-implementation-stage: 4
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Workbook sheets and headers after signature and scanner checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportInspect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/imports/preview:
    post:
      tags: [Catalog]
      summary: Предпросмотр импорта каталогов
      operationId: previewCatalogImport
      x-implementation-stage: 4
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, profile, sheet, mapping]
              properties:
                file:
                  type: string
                  format: binary
                profile:
                  $ref: '#/components/schemas/CatalogImportProfile'
                sheet:
                  type: string
                  minLength: 1
                  maxLength: 255
                mapping:
                  $ref: '#/components/schemas/CatalogImportMapping'
      responses:
        '202':
          description: Persisted terminal preview job and import plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/imports/{id}:
    get:
      tags: [Catalog]
      summary: Протокол импорта каталогов
      operationId: getCatalogImport
      x-implementation-stage: 4
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Persisted import preview and row protocol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/imports/{id}/apply:
    post:
      tags: [Catalog]
      summary: Применить импорт каталогов
      operationId: applyCatalogImport
      x-implementation-stage: 4
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImportApply'
      responses:
        '202':
          description: Persisted terminal apply job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportApplyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: Серверная сессия BFF, созданная входом через GET /api/auth/login. Swagger UI на том же origin использует сессию браузера.
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        enum: [keycloak]
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    OrganizationSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['name,asc', 'name,desc', 'updatedAt,asc', 'updatedAt,desc']
        default: 'updatedAt,desc'
    InteractionOrganizationId:
      name: organizationId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    InteractionSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['createdAt,asc', 'createdAt,desc', 'updatedAt,asc', 'updatedAt,desc', 'nextActionAt,asc']
        default: 'updatedAt,desc'
    WorkflowTemplateSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['name,asc', 'name,desc', 'version,asc', 'version,desc']
        default: 'name,asc'
    CrmProfileSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['displayName,asc', 'displayName,desc', 'role,asc', 'role,desc', 'accessRevision,asc', 'accessRevision,desc']
        default: 'displayName,asc'
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Значение token из GET /api/csrf для текущей сессии. Без заголовка или с чужим значением запрос отклоняется с 403 FORBIDDEN.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: Validation or request format error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: BFF session is absent or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated identity is not allowed to perform the action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CrmProfileRequired:
      description: The OIDC identity has no active CRM profile (CRM_PROFILE_REQUIRED) or its profile created at first login waits for administrator activation (CRM_PROFILE_PENDING)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ContactInteractionMutationForbidden:
      description: A visible organization or interaction can be changed only by an active USER or LEADER of its scope; the scope is checked first, so a hidden object is 404. Also returned when the OIDC identity has no active CRM profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Object does not exist or is outside the current server-side scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Version or idempotency conflict; VERSION_CONFLICT includes currentVersion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Uploaded payload exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DependencyUnavailable:
      description: Required dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Unexpected server error; the stack trace is written only to the server log under the same requestId
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReportCapacityExceeded:
      description: REPORT_CAPACITY_EXCEEDED, all report slots and the bounded queue are busy; nothing was stored
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReportGone:
      description: REPORT_ACCESS_CHANGED after a role, team or access revision change, or REPORT_RESULT_UNAVAILABLE when the file is gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Me:
      type: object
      required: [id, role, teamId, teamName, accessRevision]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [USER, LEADER, ADMIN]
        teamId:
          type: [string, 'null']
          format: uuid
        teamName:
          type: [string, 'null']
        accessRevision:
          type: integer
          minimum: 0
    LogoutResult:
      type: object
      required: [logoutUrl]
      properties:
        logoutUrl:
          type: string
          format: uri
          description: Keycloak end_session_endpoint with id_token_hint and post_logout_redirect_uri
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 1
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - BAD_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - CRM_PROFILE_REQUIRED
            - CRM_PROFILE_PENDING
            - LAST_ACTIVE_ADMIN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - VERSION_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - INTERNAL_ERROR
            - DEPENDENCY_UNAVAILABLE
            - REPORT_NOT_READY
            - REPORT_ACCESS_CHANGED
            - REPORT_RESULT_UNAVAILABLE
            - REPORT_CAPACITY_EXCEEDED
            - SOURCE_NOT_CONFIGURED
            - SYNC_ALREADY_RUNNING
            - SYNC_CAPACITY_EXCEEDED
            - LMS_NOT_MAPPED
            - LMS_SYNC_FAILED
        message:
          type: string
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        currentVersion:
          type: integer
          minimum: 0
    Job:
      type: object
      required: [id, status, resultReady]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        resultReady:
          type: boolean
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Organization:
      type: object
      required: [id, name, type, teamId, version, updatedAt, ownerManagerName, teamName, requiresAssignment]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [UNIVERSITY, SCHOOL]
        teamId:
          type: string
          format: uuid
        ownerManagerId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        ownerManagerName:
          type: [string, 'null']
        teamName:
          type: [string, 'null']
        requiresAssignment:
          type: boolean
          description: true, если ответственного нет или он не является активным КАМ команды вуза
    PageOrganization:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Organization'
    OrganizationAssignmentCandidate:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    OrganizationAssignment:
      type: object
      required: [version, ownerManagerId]
      properties:
        version:
          type: integer
          minimum: 0
        ownerManagerId:
          description: An active USER of the organization team, or null to explicitly remove the owner
          type: [string, 'null']
          format: uuid
    OrganizationAssignmentEvent:
      type: object
      required: [id, organizationId, commandId, actorProfileId, actorDisplayName, requestId, version, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        commandId:
          type: string
          format: uuid
        previousOwnerManagerId:
          type: [string, 'null']
          format: uuid
        previousOwnerManagerDisplayName:
          type: [string, 'null']
        ownerManagerId:
          type: [string, 'null']
          format: uuid
        newOwnerManagerDisplayName:
          type: [string, 'null']
        actorProfileId:
          type: string
          format: uuid
        actorDisplayName:
          type: string
        requestId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
    OrganizationAssignmentResult:
      type: object
      required: [organization, event]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        event:
          $ref: '#/components/schemas/OrganizationAssignmentEvent'
    Contact:
      type: object
      required: [id, organizationId, name, version, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        version:
          type: integer
          minimum: 0
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContactCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: [string, 'null']
          maxLength: 200
        email:
          type: [string, 'null']
          format: email
          maxLength: 320
        phone:
          type: [string, 'null']
          maxLength: 50
    CatalogLookup:
      type: object
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          minimum: 0
    CatalogReference:
      type: object
      required: [id, name, archived, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        version:
          type: integer
          minimum: 0
    PageCatalogLookup:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CatalogLookup'
    ProductAgreement:
      type: object
      required: [id, productId, productName, productArchived, contractNumber, licenseSigned, licenseExpiryYear, transferStatus]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        productArchived:
          type: boolean
        contractNumber:
          type: [string, 'null']
        licenseSigned:
          type: [boolean, 'null']
        licenseExpiryYear:
          type: [integer, 'null']
        transferStatus:
          type: [string, 'null']
    InteractionStage:
      type: object
      required: [id, name, order, optional]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        order:
          type: integer
          minimum: 0
        optional:
          type: boolean
    InteractionTransitionOption:
      type: object
      required: [stageId, stageName, commentRequired]
      properties:
        stageId:
          type: string
          format: uuid
        stageName:
          type: string
        commentRequired:
          type: boolean
    InteractionStageTransition:
      type: object
      required: [fromStageId, toStageId, commentRequired]
      properties:
        fromStageId:
          type: string
          format: uuid
        toStageId:
          type: string
          format: uuid
        commentRequired:
          type: boolean
    InteractionSummary:
      type: object
      required: [id, organizationId, title, currentStageId, currentStageName, nextAction, nextActionAt, contactIds, programId, productIds, lastContactAt, version, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        title:
          type: string
        currentStageId:
          type: string
          format: uuid
        currentStageName:
          type: string
        nextAction:
          type: [string, 'null']
        nextActionAt:
          type: [string, 'null']
          format: date-time
        contactIds:
          type: array
          items:
            type: string
            format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        productIds:
          type: array
          items:
            type: string
            format: uuid
        lastContactAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 0
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Interaction:
      allOf:
