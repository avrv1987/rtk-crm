          type: boolean
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        errorAt:
          type: [string, 'null']
          format: date-time
          description: Завершение последнего запуска, если он окончился неудачей после последнего успеха
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        stale:
          type: boolean
        dataObservedAt:
          type: [string, 'null']
          format: date-time
          description: Для LMS — последнее наблюдение снимков карточки
    LearningState:
      type: object
      required: [state]
      properties:
        state:
