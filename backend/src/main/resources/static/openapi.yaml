                $ref: '#/components/schemas/PageAuditEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/audit-events/export:
    get:
      tags: [Administration]
      summary: Выгрузить журнал администратора и безопасности
      operationId: exportAuditEvents
      description: >-
        Строки, соответствующие фильтрам экрана журнала, сначала новые; права те же, что на просмотр журнала (ADMIN). Если строк больше app.reports.max-rows (как у отчётов, по умолчанию 50000), ответ 422 REPORT_ROW_LIMIT: сузьте период или фильтры. Само выполнение выгрузки записывается в журнал (JOURNAL_EXPORTED).
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [XLSX, CSV]
            default: XLSX
        - name: from
          in: query
          required: false
          description: Первый день периода, московское время
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Последний день периода включительно, московское время
          schema:
            type: string
            format: date
        - name: actor
          in: query
          required: false
          description: Часть имени автора
          schema:
            type: string
            maxLength: 200
        - name: object
          in: query
          required: false
          description: Часть имени объекта или деталей
          schema:
            type: string
            maxLength: 200
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditCategory'
      responses:
        '200':
          description: Файл журнала; Content-Disposition содержит имя файла в UTF-8 (filename*)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: REPORT_ROW_LIMIT — строк по фильтрам больше app.reports.max-rows; сузьте период или фильтры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
