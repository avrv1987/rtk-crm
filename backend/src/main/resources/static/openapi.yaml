      properties:
        state:
          type: string
          enum: [AVAILABLE, NO_PROGRAM, NOT_CONFIGURED, NOT_MAPPED, OTHER_CYCLE, NOT_DATED, SOURCE_FAILED, RUN_ENDED, NOT_SYNCED]
        message:
          type: [string, 'null']
