      x-implementation-stage: 5
      description: >
        Counts over exactly the same row set as the report with the same filters, aggregated by the database; rows are
        not loaded into the API process and app.reports.max-rows does not apply. unknownCount holds rows without a
        value for the grouping; groups present in items with count 0 are real zeros (MONTH is zero-filled over the period).
        MONTH with kind PORTFOLIO and periodBasis ACTIVITY or ACTIVE is rejected with 400 VALIDATION_ERROR (field groupBy).
        seriesBy (only with MONTH) adds series, the monthly counts split by that grouping; rows without a value form the
        «Не указано» series. DURATION is not grouped here and returns 400 VALIDATION_ERROR.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
