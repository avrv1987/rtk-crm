openapi: 3.1.0
info:
  title: CRM ИТ Школы РТК — REST API
  version: 0.2.0
  description: |
    API веб-клиента CRM и точка интеграции с корпоративными системами.

    Аутентификация: вход через Keycloak (GET /api/auth/login) создаёт серверную сессию BFF, браузер получает HttpOnly cookie SESSION; токены OIDC клиенту не передаются. Выход (POST /api/auth/logout) завершает сессию CRM и возвращает адрес завершения сессии Keycloak.

    Изменяющие запросы передают заголовок X-CSRF-TOKEN со значением token из GET /api/csrf. Команды передают Idempotency-Key; повтор с тем же ключом и телом возвращает прежний результат, с другим телом — 409 IDEMPOTENCY_CONFLICT. Устаревшая version даёт 409 VERSION_CONFLICT с currentVersion.

    Ошибки возвращаются в формате ApiError {code, message, requestId}. requestId совпадает с заголовком X-Request-Id и записью в журнале сервера; stack trace и секреты в ответ не попадают.
servers:
  - url: /
tags:
  - name: Session
  - name: Catalog
  - name: Interaction
  - name: Jobs
  - name: Reports
  - name: Administration
  - name: Work
paths:
  /api/auth/login:
    get:
      tags: [Session]
      summary: Начать вход через Keycloak
      operationId: startLogin
      security: []
      responses:
        '302':
          description: Redirect to the BFF authorization endpoint, which redirects to the configured OIDC provider
          headers:
            Location:
              description: Browser redirect target at the OIDC provider
              required: true
              schema:
                type: string
                format: uri-reference
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/callback/{registrationId}:
    get:
      tags: [Session]
      summary: Завершить вход через Keycloak
      operationId: finishLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: BFF session is established and the browser is redirected to the SPA
          headers:
            Location:
              description: Browser redirect target in the SPA
              required: true
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [Session]
      summary: Выйти из CRM и Keycloak
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: BFF session and browser cookies are cleared; the browser opens logoutUrl to end the Keycloak session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      tags: [Session]
      summary: Текущий профиль CRM
      operationId: getCurrentProfile
      responses:
        '200':
          description: Active CRM profile for the authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me/activation-request:
    post:
      tags: [Session]
      summary: Сообщить администратору о профиле, ожидающем активации
      operationId: requestProfileActivation
      description: >-
        Available only to an identity whose CRM profile waits for activation. The first call stores the request time,
        the administrator sees it in the profile list and the security journal; repeated calls return the same time.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Time when the administrator was notified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/csrf:
    get:
      tags: [Session]
      summary: Получить CSRF-токен сессии
      operationId: getCsrfToken
      responses:
        '200':
          description: Token and header name for the current BFF session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations:
    get:
      tags: [Catalog]
      summary: Список организаций
      operationId: listOrganizations
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/OrganizationSort'
        - name: q
          in: query
          required: false
          description: Часть названия без учёта регистра
          schema:
            type: string
            maxLength: 200
        - name: requiresAssignment
          in: query
          required: false
          description: Только вузы без ответственного или с ответственным, который не является активным КАМ или руководителем команды вуза
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          required: false
          description: Состояние организации; по умолчанию CURRENT — действующие и ожидающие подтверждения
          schema:
            type: string
            enum: [CURRENT, PENDING, ARCHIVED, ALL]
            default: CURRENT
      responses:
        '200':
          description: Organizations visible within the current server-side business scope, filtered and counted on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      summary: Добавить организацию
      operationId: createOrganization
      x-implementation-stage: 5
      description: >-
        Руководитель создаёт действующую организацию своей команды без ответственного. КАМ создаёт организацию своей
        команды с собой в роли ответственного; при app.organizations.manager-creation-requires-approval=true она
        получает статус PENDING до подтверждения руководителем. Дубль по нормализованному названию отклоняется.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationDetails'
      responses:
        '201':
          description: Организация создана или отправлена на подтверждение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/duplicates:
    get:
      tags: [Catalog]
      summary: Возможные дубли организации
      operationId: findOrganizationDuplicates
      x-implementation-stage: 5
      description: >-
        Совпадение по нормализованному названию (регистр, пробелы, кавычки, ё) ищется во всём каталоге; похожие
        названия — только в области видимости. Для организации вне области видимости id не возвращается.
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            maxLength: 300
        - name: exceptId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: До десяти возможных дублей, точные совпадения первыми
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDuplicate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}:
    get:
      tags: [Catalog]
      summary: Карточка организации
      operationId: getOrganization
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Organization visible within the current server-side business scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Catalog]
      summary: Изменить название и реквизиты организации
      operationId: updateOrganization
      x-implementation-stage: 5
      description: Только руководитель команды организации; изменение пишется в журнал справочников.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationDetails'
      responses:
        '200':
          description: Организация изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/status:
    post:
      tags: [Catalog]
      summary: Подтвердить, отклонить, архивировать или восстановить организацию
      operationId: changeOrganizationStatus
      x-implementation-stage: 5
      description: >-
        APPROVE и REJECT — руководитель для заявки PENDING; ARCHIVE — руководитель или КАМ-ответственный; RESTORE —
        руководитель. Архивная организация скрыта из списков и не принимает новые взаимодействия, история сохраняется.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationStatusChange'
      responses:
        '200':
          description: Состояние изменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/contacts:
    get:
      tags: [Catalog]
      summary: Контакты организации
      operationId: listOrganizationContacts
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Contacts belonging to the visible organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      summary: Добавить контакт организации
      operationId: createOrganizationContact
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '201':
          description: Contact created in the visible organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/contacts/{contactId}:
    patch:
      tags: [Catalog]
      summary: Изменить контакт организации
      operationId: updateOrganizationContact
      x-implementation-stage: 4
      description: >-
        Replaces the editable fields of the contact: name, position, email, phone, role, primary and inactive flags.
        confirm=true stamps the confirmation with the current user and time. Only one contact of an organization is
        primary: marking a new primary contact clears the previous one with its own history event. An inactive contact
        cannot be primary and is not accepted for new links to interactions; existing links and history keep its name.
        Every effective change writes one contact event with previous and new values; a request without changes
        returns the contact unchanged.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Contact after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/contacts/{contactId}/events:
    get:
      tags: [Catalog]
      summary: История изменений контакта
      operationId: listOrganizationContactEvents
      x-implementation-stage: 4
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contact changes with author, time and previous and new values, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment-options:
    get:
      tags: [Catalog]
      summary: Кандидаты в ответственные за вуз
      operationId: listOrganizationAssignmentOptions
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: >-
            Active USER profiles of the visible organization's team and the requesting LEADER himself;
            available only to a LEADER of that team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAssignmentCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment-events:
    get:
      tags: [Catalog]
      summary: История назначений ответственного
      operationId: listOrganizationAssignmentEvents
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: >-
            Immutable owner assignment history of the visible organization with the handover note and the reason of an
            automatic deassignment; available to the team LEADER and to the USER who currently owns the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAssignmentEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment:
    post:
      tags: [Catalog]
      summary: Назначить ответственного КАМ
      operationId: assignOrganizationOwner
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationAssignment'
      responses:
        '200':
          description: Updated organization and its immutable owner assignment event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAssignmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization-assignments:
    post:
      tags: [Catalog]
      summary: Передать несколько вузов ответственным КАМ
      operationId: bulkAssignOrganizations
      description: Одна команда руководителя на 1–100 вузов своей команды, каждому вузу — свой новый КАМ. Все вузы проверяются до изменений (чужой вуз — 404, ничего не меняется); вуз, уже закреплённый за этим КАМ, возвращается в unchangedOrganizationIds. Каждое назначение пишет запись в историю назначений вуза.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationBulkAssignment'
      responses:
        '200':
          description: Changed organizations with their assignment events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBulkAssignmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/deputies:
    get:
      tags: [Catalog]
      summary: Замещения ответственного КАМ вуза
      operationId: listOrganizationDeputies
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Deputy periods of the visible organization, newest first, available only to its LEADER
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDeputy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      summary: Назначить временного заместителя КАМ
      operationId: assignOrganizationDeputy
      description: Заместитель — активный КАМ команды вуза, отличный от ответственного; у вуза одно открытое замещение. На период с startsOn по endsOn включительно (по Москве) заместитель видит вуз и ведёт его работы, основной КАМ остаётся ответственным и сохраняет доступ. После окончания периода доступ заместителя закрывается автоматически.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationDeputyCreate'
      responses:
        '201':
          description: Created deputy period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDeputy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/deputies/{deputyId}/end:
    post:
      tags: [Catalog]
      summary: Досрочно завершить замещение
      operationId: endOrganizationDeputy
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - name: deputyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
