            format: date
        - name: to
          in: query
          required: false
          description: Последний день периода включительно, московское время
          schema:
            type: string
            format: date
        - name: actor
          in: query
          required: false
          description: Часть имени автора
          schema:
            type: string
            maxLength: 200
        - name: object
          in: query
          required: false
          description: Часть имени объекта или деталей
          schema:
            type: string
            maxLength: 200
        - name: category
          in: query
