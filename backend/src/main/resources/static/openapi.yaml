openapi: 3.1.0
info:
  title: CRM ИТ Школы РТК — REST API
  version: 0.2.0
  description: |
    API веб-клиента CRM и точка интеграции с корпоративными системами.

    Аутентификация: вход через Keycloak (GET /api/auth/login) создаёт серверную сессию BFF, браузер получает HttpOnly cookie SESSION; токены OIDC клиенту не передаются. Выход (POST /api/auth/logout) завершает сессию CRM и возвращает адрес завершения сессии Keycloak.

    Изменяющие запросы передают заголовок X-CSRF-TOKEN со значением token из GET /api/csrf. Команды передают Idempotency-Key; повтор с тем же ключом и телом возвращает прежний результат, с другим телом — 409 IDEMPOTENCY_CONFLICT. Устаревшая version даёт 409 VERSION_CONFLICT с currentVersion.

    Ошибки возвращаются в формате ApiError {code, message, requestId}. requestId совпадает с заголовком X-Request-Id и записью в журнале сервера; stack trace и секреты в ответ не попадают.
servers:
  - url: /
tags:
  - name: Session
  - name: Catalog
  - name: Interaction
  - name: Jobs
  - name: Reports
  - name: Administration
  - name: Work
  - name: Enrolment
paths:
  /api/auth/login:
    get:
      tags: [Session]
      summary: Начать вход через Keycloak
      operationId: startLogin
      security: []
      responses:
        '302':
          description: Редирект на эндпоинт авторизации BFF, который перенаправляет на настроенный провайдер OIDC
          headers:
            Location:
              description: Адрес редиректа браузера у провайдера OIDC
              required: true
              schema:
                type: string
                format: uri-reference
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/callback/{registrationId}:
    get:
      tags: [Session]
      summary: Завершить вход через Keycloak
      operationId: finishLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Сессия BFF установлена, браузер перенаправлен на SPA
          headers:
            Location:
              description: Адрес редиректа браузера в SPA
              required: true
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [Session]
      summary: Выйти из CRM и Keycloak
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Сессия BFF и cookie браузера очищены; браузер открывает logoutUrl для завершения сессии Keycloak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      tags: [Session]
      summary: Текущий профиль CRM
      operationId: getCurrentProfile
      responses:
        '200':
          description: Активный профиль CRM для аутентифицированной личности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me/activation-request:
    post:
      tags: [Session]
      summary: Сообщить администратору о профиле, ожидающем активации
      operationId: requestProfileActivation
      description: >-
        Доступно только личности, чей профиль CRM ожидает активации. Первый вызов сохраняет время запроса, администратор видит его в списке профилей и журнале безопасности; повторные вызовы возвращают то же время.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Время, когда был уведомлён администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/csrf:
    get:
      tags: [Session]
      summary: Получить CSRF-токен сессии
      operationId: getCsrfToken
      responses:
        '200':
          description: Токен и имя заголовка для текущей сессии BFF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations:
    get:
      tags: [Catalog]
      summary: Список организаций
      operationId: listOrganizations
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/OrganizationSort'
        - name: q
          in: query
          required: false
          description: Часть названия без учёта регистра
          schema:
            type: string
            maxLength: 200
        - name: requiresAssignment
          in: query
          required: false
          description: Только вузы без ответственного или с ответственным, который не является активным КАМ или руководителем команды вуза
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          required: false
          description: Состояние организации; по умолчанию CURRENT — действующие и ожидающие подтверждения
          schema:
            type: string
            enum: [CURRENT, PENDING, ARCHIVED, ALL]
            default: CURRENT
      responses:
        '200':
          description: Организации, видимые в текущей серверной бизнес-области, отфильтрованные и подсчитанные на сервере
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      summary: Добавить организацию
      operationId: createOrganization
      x-implementation-stage: 5
      description: >-
        Руководитель создаёт действующую организацию своей команды без ответственного. КАМ создаёт организацию своей
        команды с собой в роли ответственного; при app.organizations.manager-creation-requires-approval=true она
        получает статус PENDING до подтверждения руководителем. Дубль по нормализованному названию отклоняется.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationDetails'
      responses:
        '201':
          description: Организация создана или отправлена на подтверждение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/duplicates:
    get:
      tags: [Catalog]
      summary: Возможные дубли организации
      operationId: findOrganizationDuplicates
      x-implementation-stage: 5
      description: >-
        Совпадение по нормализованному названию (регистр, пробелы, кавычки, ё) ищется во всём каталоге; похожие
        названия — только в области видимости. Для организации вне области видимости id не возвращается.
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            maxLength: 300
        - name: exceptId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: До десяти возможных дублей, точные совпадения первыми
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDuplicate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}:
    get:
      tags: [Catalog]
      summary: Карточка организации
      operationId: getOrganization
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Организация, видимая в текущей серверной бизнес-области
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Catalog]
      summary: Изменить название и реквизиты организации
      operationId: updateOrganization
      x-implementation-stage: 5
      description: Только руководитель команды организации; изменение пишется в журнал справочников.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationDetails'
      responses:
        '200':
          description: Организация изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/status:
    post:
      tags: [Catalog]
      summary: Подтвердить, отклонить, архивировать или восстановить организацию
      operationId: changeOrganizationStatus
      x-implementation-stage: 5
      description: >-
        APPROVE и REJECT — руководитель для заявки PENDING; ARCHIVE — руководитель или КАМ-ответственный; RESTORE —
        руководитель. Архивная организация скрыта из списков и не принимает новые взаимодействия, история сохраняется.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationStatusChange'
      responses:
        '200':
          description: Состояние изменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/contacts:
    get:
      tags: [Catalog]
      summary: Контакты организации
      operationId: listOrganizationContacts
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Контакты, принадлежащие видимой организации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      summary: Добавить контакт организации
      operationId: createOrganizationContact
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '201':
          description: Контакт создан в видимой организации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/contacts/{contactId}:
    patch:
      tags: [Catalog]
      summary: Изменить контакт организации
      operationId: updateOrganizationContact
      x-implementation-stage: 4
      description: >-
        Заменяет редактируемые поля контакта: имя, должность, email, телефон, роль, флаги основного и неактивного контакта. confirm=true фиксирует подтверждение текущим пользователем и временем. Основным может быть только один контакт организации: назначение нового основного контакта снимает признак с предыдущего отдельным событием истории. Неактивный контакт не может быть основным и не принимается для новых связей со взаимодействиями; существующие связи и история сохраняют его имя. Каждое эффективное изменение записывает одно событие контакта с прежними и новыми значениями; запрос без изменений возвращает контакт без изменений.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Контакт после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/contacts/{contactId}/events:
    get:
      tags: [Catalog]
      summary: История изменений контакта
      operationId: listOrganizationContactEvents
      x-implementation-stage: 4
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Изменения контакта с автором, временем, прежними и новыми значениями, сначала старые
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment-options:
    get:
      tags: [Catalog]
      summary: Кандидаты в ответственные за вуз
      operationId: listOrganizationAssignmentOptions
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: >-
            Активные профили USER команды видимой организации и сам запрашивающий LEADER; доступно только LEADER этой команды
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAssignmentCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment-events:
    get:
      tags: [Catalog]
      summary: История назначений ответственного
      operationId: listOrganizationAssignmentEvents
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: >-
            Неизменяемая история назначений ответственного видимой организации с примечанием передачи и причиной автоматического снятия; доступно LEADER команды и USER, который сейчас является ответственным за организацию
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAssignmentEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment:
    post:
      tags: [Catalog]
      summary: Назначить ответственного КАМ
      operationId: assignOrganizationOwner
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationAssignment'
      responses:
        '200':
          description: Обновлённая организация и её неизменяемое событие назначения ответственного
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAssignmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization-assignments:
    post:
      tags: [Catalog]
      summary: Передать несколько вузов ответственным КАМ
      operationId: bulkAssignOrganizations
      description: Одна команда руководителя на 1–100 вузов своей команды, каждому вузу — свой новый КАМ. Все вузы проверяются до изменений (чужой вуз — 404, ничего не меняется); вуз, уже закреплённый за этим КАМ, возвращается в unchangedOrganizationIds. Каждое назначение пишет запись в историю назначений вуза.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationBulkAssignment'
      responses:
        '200':
          description: Изменённые организации с их событиями назначения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBulkAssignmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/deputies:
    get:
      tags: [Catalog]
      summary: Замещения ответственного КАМ вуза
      operationId: listOrganizationDeputies
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Периоды замещения видимой организации, сначала новые, доступно только её LEADER
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDeputy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
