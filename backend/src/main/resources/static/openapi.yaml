  /api/reports:
    post:
      tags: [Reports]
      summary: Заказать отчёт или диаграмму
      operationId: createReportJob
      x-implementation-stage: 5
      description: >
        Persists a PENDING report job and hands it to one of the bounded report slots. The same Idempotency-Key with
        the same payload returns the same jobId; a different payload under the key returns 409 IDEMPOTENCY_CONFLICT.
        503 REPORT_CAPACITY_EXCEEDED with Retry-After means all slots and the bounded queue are busy and no job was kept.
        With groupBy the job renders a chart of POST /api/statistics for the same request as PNG or PDF (chart, basis
        table, unit, period, filters and generation time) instead of the row report. chartType LINE (or seriesBy)
        renders a line chart of MONTH grouping, one line per seriesBy group; more than maxChartSeries lines or
        maxChartBars months fail the job with REPORT_CHART_LIMIT. DURATION rejects groupBy with 400 VALIDATION_ERROR.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '202':
          description: Report job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportJobCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ReportCapacityExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
