    ReportKind:
      type: string
      description: >
        DEMAND ранжирует программы по отдельным сортируемым показателям: заявки с сайта (записи learning_application,
        применённые из предложенного договора, отозванные исключены), участники — по последним снимкам Moodle запусков
        обучения студентов (курсы и группы, сопоставленные с датами запуска), пересекающимся с периодом хотя бы на один
        день, последнее наблюдение открытого запуска или последнее до конца закрытого; запуски обучения преподавателей
        исключены; завершившие суммируются по запускам с отслеживанием завершения; и параллельные запуски — число тех
        запусков обучения, чей интервал [runStartsOn, runEndsOn) содержит последний день периода, либо дату отчёта, если
        у периода нет конца; показатель без исходных данных — null («нет данных»), а не 0; сводный индекс не считается.
        EVENTS также перечисляет назначение, переназначение и снятие КАМ организации как строки без взаимодействия
        только для LEADER; USER получает только события взаимодействий. SNAPSHOT показывает взаимодействия, созданные
        до конца asOf, с этапом последнего перехода и КАМ организации, восстановленным из истории назначений на эту
        дату; from и to отклоняются. DURATION группирует по команде, программе и этапу среднее и максимальное число
        дней пребывания на этапе и всего цикла (от создания до первого входа на последний этап маршрута), завершённых
        в периоде, плюс пребывания, всё ещё открытые на конец периода. AGREEMENTS выдаёт одну строку на каждое
        мероприятие плана по договору (договор без мероприятий даёт одну строку): период отбирает мероприятия, чьи
        фактические даты, иначе плановые даты, иначе срок договора пересекаются с ним; MANAGER — ответственный за
        мероприятие, PARTICIPANTS суммирует участия в Moodle по программам связанных работ, считая только запуски
        обучения, чей интервал [runStartsOn, runEndsOn) пересекается и с датами мероприятия, и с периодом отчёта;
        применяются только фильтры organizationIds, organizationType, managerIds и includeNoManager, диаграмма не строится
      enum: [PORTFOLIO, EVENTS, DEMAND, SNAPSHOT, DURATION, AGREEMENTS]
    ReportFormat:
      type: string
      description: PNG допустим только для диаграммы (при заданном groupBy); диаграмма экспортируется как PNG или PDF
      enum: [XLSX, XLS, PDF, JSON, PNG]
    PeriodBasis:
      type: string
      description: >
        Только PORTFOLIO. CREATED отбирает взаимодействия, созданные в периоде, ACTIVITY — имеющие в нём хотя бы одно событие, ACTIVE — созданные до конца периода и не завершённые до его начала (статус работы пока не учитывается, поэтому активно любое взаимодействие, созданное до конца периода)
      enum: [CREATED, ACTIVITY, ACTIVE]
    ChartType:
      type: string
      description: BAR (по умолчанию) для горизонтальных столбцов, LINE для линейного графика с группировкой MONTH
      enum: [BAR, LINE]
    ReportEventType:
      type: string
      description: >
        Фильтр EVENTS; ASSIGNMENT охватывает назначение, переназначение и снятие КАМ организации и отбирает строки только для LEADER (USER не получает по нему строк)
      enum: [CREATED, TRANSITIONED, COMMENTED, STAGES_EDITED, PLAN_UPDATED, DETAILS_UPDATED, STATUS_CHANGED,
             AGREEMENT_UPDATED, ATTACHMENT_DELETED, STAGE_COMPLETED, STAGE_COMPLETION_CLEARED, ASSIGNMENT]
    InteractionFlag:
      type: string
      description: WAITING_UNIVERSITY — ждём ответа вуза; WAITING_RTK — ждём действия РТК; PROBLEM — отмечена проблема; RISK — отмечен риск любого уровня
      enum: [WAITING_UNIVERSITY, WAITING_RTK, PROBLEM, RISK]
    ReportColumn:
      type: string
      description: >
        PORTFOLIO допускает ORGANIZATION, INTERACTION, DIRECTION, PROGRAM, PRODUCTS, STAGE, DAYS_ON_STAGE, WORK_STATUS,
        WAITING, PROBLEM, RISK, MANAGER, CREATED_AT, LAST_EVENT_AT, NEXT_ACTION, NEXT_ACTION_AT, VENDORS, CONTRACT_NUMBER,
        LICENSE_SIGNED, LICENSE_EXPIRY_YEAR, TRANSFER_STATUS, MATERIALS_TRANSFERRED_ON; DAYS_ON_STAGE — число полных
        дней от последнего входа на текущий этап (от создания, если карточка ни разу не входила на него через переход)
        до момента формирования отчёта; колонки по договору показывают само значение для одного продукта и пары
        «продукт: значение» для нескольких. EVENTS допускает EVENT_AT, ORGANIZATION, INTERACTION, EVENT_TYPE,
        FROM_STAGE, STAGE, COMMENT, AUTHOR, MANAGER, DIRECTION, PROGRAM, PRODUCTS. DEMAND допускает DIRECTION, PROGRAM,
        APPLICATIONS, PAID_ORDERS, PAID_STREAMS, PARTICIPANTS, LEARNERS_COMPLETED, PARALLEL_RUNS; заголовки колонок
        DEMAND несут период заявок, последнее наблюдение Moodle и дату параллельных запусков. PAID_ORDERS считает
        различные номера оплаченных заказов, а PAID_STREAMS — различные пары «курс и поток» применённых записей
        paid_order сервисной организации «Открытый набор (физлица)», видимой каждому USER и LEADER; период отчёта к
        ним не применяется, поскольку сайт не передаёт дату оплаты. SNAPSHOT допускает ORGANIZATION, INTERACTION,
        DIRECTION, PROGRAM, PRODUCTS, STAGE, MANAGER, CREATED_AT, LAST_EVENT_AT. DURATION допускает TEAM, PROGRAM,
        STAGE, COMPLETED, AVG_DAYS, MAX_DAYS, CURRENT, CURRENT_MAX_DAYS; дни — десятичные числа с одним знаком после
        запятой. AGREEMENTS допускает ORGANIZATION, AGREEMENT, AGREEMENT_STATUS, AGREEMENT_TERM, ACTIVITY_KIND,
        ACTIVITY, PLANNED_VOLUME, ACTUAL_VOLUME, VOLUME_UNIT, PLANNED_DATES, ACTUAL_DATES, MANAGER, ACTIVITY_STATUS,
        PARTICIPANTS, WORKS, CONFIRMATIONS, CONFIRMATION_LINKS.
      enum: [ORGANIZATION, INTERACTION, DIRECTION, PROGRAM, PRODUCTS, STAGE, DAYS_ON_STAGE, WORK_STATUS, WAITING, PROBLEM, RISK,
             MANAGER, CREATED_AT, LAST_EVENT_AT, NEXT_ACTION, NEXT_ACTION_AT, EVENT_AT, EVENT_TYPE, FROM_STAGE, COMMENT, AUTHOR,
             APPLICATIONS, PAID_ORDERS, PAID_STREAMS, PARTICIPANTS, LEARNERS_COMPLETED, PARALLEL_RUNS, VENDORS, CONTRACT_NUMBER,
             LICENSE_SIGNED, LICENSE_EXPIRY_YEAR,
             TRANSFER_STATUS, MATERIALS_TRANSFERRED_ON, TEAM, COMPLETED, AVG_DAYS, MAX_DAYS, CURRENT, CURRENT_MAX_DAYS,
             AGREEMENT, AGREEMENT_STATUS, AGREEMENT_TERM, ACTIVITY_KIND, ACTIVITY, PLANNED_VOLUME, ACTUAL_VOLUME,
             VOLUME_UNIT, PLANNED_DATES, ACTUAL_DATES, ACTIVITY_STATUS, WORKS, CONFIRMATIONS, CONFIRMATION_LINKS]
    ReportFilters:
      type: object
      description: >
        Пустой список с флагом include=false оставляет измерение без фильтрации, включая строки без значения. includeNo* добавляет к выбранным id строки без значения. managerIds и includeNoManager используют текущего ответственного организации в PORTFOLIO и DEMAND и снимок ответственного события в EVENTS. DEMAND отклоняет productIds, includeNoProduct, stages, workStatuses и flags с 400 VALIDATION_ERROR.
      properties:
        organizationIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        directionIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoDirection:
          type: boolean
        programIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoProgram:
          type: boolean
        productIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoProduct:
          type: boolean
        managerIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoManager:
          type: boolean
        stages:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 200
        organizationType:
          type: [string, 'null']
          enum: [UNIVERSITY, SCHOOL, COLLEGE, OPEN_ENROLLMENT, null]
        workStatuses:
          description: Статусы работы (активна, приостановлена, завершена); пустой список не ограничивает отбор
          type: array
          maxItems: 3
          items:
            type: string
            enum: [ACTIVE, PAUSED, COMPLETED]
        flags:
          description: Отметки работы; выбранные отметки должны быть у работы одновременно, пустой список не ограничивает отбор
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/InteractionFlag'
        agreement:
          $ref: '#/components/schemas/ReportAgreementFilters'
        eventTypes:
          type: array
          description: Только EVENTS; пусто означает все виды, включая назначения КАМ, другие виды отклоняют непустой список
          items:
            $ref: '#/components/schemas/ReportEventType'
        minDaysOnStage:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
          description: >
            Только PORTFOLIO; оставляет взаимодействия, чей последний вход в текущий этап произошёл не менее чем за столько дней до формирования отчёта — то же правило, что у DAYS_ON_STAGE и фильтра minDaysOnStage списка работ; другие виды отклоняют его с 400 VALIDATION_ERROR
    ReportAgreementFilters:
      type: object
      description: >
        Условия на один и тот же договор по продукту взаимодействия (ограничивается productIds, если они переданы):
        vendor, факт подписания лицензии (false означает не подписано или не указано), год истечения лицензии не позже
        licenseExpiresBy и отсутствие отметки TRANSFERRED для каждого kind из notTransferred; договор без каких-либо
        отметок, у которого сохранённый transferStatus — «Передано», считается полностью переданным. DEMAND отклоняет
        любое из них с 400.
      properties:
        vendorIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        licenseSigned:
          type: [boolean, 'null']
        licenseExpiresBy:
          type: [integer, 'null']
          minimum: 2000
          maximum: 2100
        notTransferred:
          type: array
          items:
            $ref: '#/components/schemas/ProductTransferKind'
    ReportPreviewRequest:
      type: object
      required: [kind]
      description: from и to — включительные даты, преобразуемые в [from 00:00, to+1 00:00) по Europe/Moscow
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        asOf:
          type: [string, 'null']
          format: date
          description: Только SNAPSHOT; состояние на конец этого дня по московскому времени, сегодня, если не указано; будущая дата отклоняется
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        filters:
          $ref: '#/components/schemas/ReportFilters'
        columns:
          type: array
          description: >
            Отсутствие или пустое значение означает столбцы по умолчанию для вида в порядке по умолчанию: для PORTFOLIO все столбцы, кроме относящихся к соглашению (VENDORS, CONTRACT_NUMBER, LICENSE_SIGNED, LICENSE_EXPIRY_YEAR, TRANSFER_STATUS, MATERIALS_TRANSFERRED_ON), которые возвращаются только при явном указании; для EVENTS и DEMAND — все столбцы
          items:
            $ref: '#/components/schemas/ReportColumn'
        sortBy:
          description: >
            Только для DEMAND: APPLICATIONS (по умолчанию), PAID_ORDERS, PAID_STREAMS, PARTICIPANTS, LEARNERS_COMPLETED
            или PARALLEL_RUNS; строки сортируются по этому показателю по убыванию, «нет данных» — в конце, затем по
            названию программы. Остальные виды отклоняют его с 400 VALIDATION_ERROR.
          oneOf:
            - $ref: '#/components/schemas/ReportColumn'
            - type: 'null'
    ReportRequest:
      allOf:
        - $ref: '#/components/schemas/ReportPreviewRequest'
        - type: object
          required: [format]
          properties:
            format:
              $ref: '#/components/schemas/ReportFormat'
            groupBy:
              description: >
                Указывается, чтобы заказать диаграмму статистики с такой группировкой вместо построчного отчёта; columns игнорируется, format должен быть PNG или PDF
              oneOf:
                - $ref: '#/components/schemas/StatisticsGroupBy'
                - type: 'null'
            chartType:
              oneOf:
                - $ref: '#/components/schemas/ChartType'
                - type: 'null'
            seriesBy:
              description: Только для линейного графика, с groupBy MONTH; одна линия на группу этой группировки
              oneOf:
                - $ref: '#/components/schemas/StatisticsGroupBy'
                - type: 'null'
    ReportJobCreated:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid
    ReportJob:
      type: object
      required: [id, kind, format, status, progress, resultReady, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ReportKind'
        format:
          $ref: '#/components/schemas/ReportFormat'
        groupBy:
          description: Группировка задания диаграммы; null для построчного отчёта
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
        chartType:
          description: BAR или LINE для задания диаграммы; null для построчного отчёта
          oneOf:
            - $ref: '#/components/schemas/ChartType'
            - type: 'null'
        seriesBy:
          description: Группировка отдельных линий задания линейного графика; иначе null
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resultReady:
          type: boolean
        rowCount:
          type: [integer, 'null']
          minimum: 0
        fileName:
          type: [string, 'null']
        error:
          type: object
          required: [code, message]
          description: Присутствует для заданий со статусом FAILED, например REPORT_ROW_LIMIT, REPORT_XLS_ROW_LIMIT, REPORT_PDF_ROW_LIMIT, REPORT_CHART_LIMIT, REPORT_ACCESS_CHANGED, REPORT_INTERRUPTED, REPORT_FAILED
          properties:
            code:
              type: string
            message:
              type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    ReportColumnView:
      type: object
      required: [id, title, emptyText]
      properties:
        id:
          $ref: '#/components/schemas/ReportColumn'
        title:
          type: string
        emptyText:
          type: string
          description: >
            Текст для пустых значений: «Не указано» для направления, программы, продуктов и менеджера, «нет данных»
            для APPLICATIONS, PAID_ORDERS, PAID_STREAMS, PARTICIPANTS и PARALLEL_RUNS
    ReportPreview:
      type: object
      required: [kind, generatedAt, notes, columns, items, page, size, total]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        generatedAt:
          type: string
          format: date-time
        notes:
          type: array
          description: Те же время формирования, правило периода, семантика менеджера и строки фильтров, что и в заголовке файла
          items:
            type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ReportColumnView'
        items:
          type: array
          description: >
            Объекты строк с ключами по id столбца; даты — строки ISO 8601, показатели DEMAND и счётчики DURATION — целые числа, дни DURATION — числа с плавающей точкой, отсутствующие значения — null
          items:
            type: object
            additionalProperties:
              type: [string, number, 'null']
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
    StatisticsGroupBy:
      type: string
      description: DEMAND суммирует заявки и принимает ORGANIZATION, DIRECTION, PROGRAM, MANAGER и MONTH (месяц подачи)
      enum: [STAGE, ORGANIZATION, DIRECTION, PROGRAM, PRODUCT, MANAGER, MONTH]
    StatisticsRequest:
      type: object
      required: [kind, groupBy]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        groupBy:
          $ref: '#/components/schemas/StatisticsGroupBy'
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        filters:
          $ref: '#/components/schemas/ReportFilters'
        asOf:
          type: [string, 'null']
          format: date
        seriesBy:
          description: Только с groupBy MONTH; разбивает месячные счётчики на серии этой группировки для линейного графика
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
    StatisticsSeries:
      type: object
      required: [key, label, unspecified, counts]
      properties:
        key:
          type: string
        label:
          type: string
        unspecified:
          type: boolean
          description: Строки без значения seriesBy («Не указано»), всегда последняя серия
        counts:
          type: array
          description: По одному счётчику на элемент результата, в том же порядке
          items:
            type: integer
            minimum: 0
    StatisticsItem:
      type: object
      required: [key, label, count]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
          minimum: 0
    StatisticsResult:
      type: object
      required: [kind, groupBy, unit, timezone, generatedAt, filters, notes, total, unknownCount, items, maxChartBars, series,
                 maxChartSeries]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        groupBy:
          $ref: '#/components/schemas/StatisticsGroupBy'
        unit:
          type: string
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        timezone:
          type: string
        generatedAt:
          type: string
          format: date-time
        filters:
          $ref: '#/components/schemas/ReportFilters'
        notes:
          type: array
          items:
            type: string
        total:
          type: integer
          minimum: 0
          description: >
            Число строк отчёта; для DEMAND — число заявок. Суммы по PRODUCT могут превышать это число, так как у одного взаимодействия может быть несколько продуктов
        unknownCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsItem'
        maxChartBars:
          type: integer
          minimum: 1
          description: >
            Наибольшее число столбцов, которое вмещает файл диаграммы PNG/PDF, считая столбец «Не указано» для
            DIRECTION, PROGRAM, PRODUCT и MANAGER (и STAGE для EVENTS, где у назначений КАМ нет этапа); при превышении
            задание на диаграмму завершается с REPORT_CHART_LIMIT. Для линейной диаграммы ограничивает число месяцев
        asOf:
          type: [string, 'null']
          format: date
        seriesBy:
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
        series:
          type: array
          description: Пусто без seriesBy; упорядочено по убыванию суммы, «Не указано» — последней
          items:
            $ref: '#/components/schemas/StatisticsSeries'
        maxChartSeries:
          type: integer
          minimum: 1
          description: Наибольшее число линий, которое может вместить линейный график PNG/PDF; задание с большим числом линий завершается ошибкой REPORT_CHART_LIMIT
    SavedReportPeriod:
      type: string
      description: >
        Относительный период сохранённого отчёта, вычисляемый по Europe/Moscow при чтении списка: календарный месяц или квартал, содержащий сегодня, либо предыдущий
      enum: [CURRENT_MONTH, PREVIOUS_MONTH, CURRENT_QUARTER, PREVIOUS_QUARTER]
    SavedReport:
      type: object
      required: [id, name, definition, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        definition:
          description: При заданном period поля from и to содержат даты этого периода для текущего дня
          allOf:
            - $ref: '#/components/schemas/ReportPreviewRequest'
        period:
          oneOf:
            - $ref: '#/components/schemas/SavedReportPeriod'
            - type: 'null'
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SavedReportRequest:
      type: object
      required: [name, definition]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          $ref: '#/components/schemas/ReportPreviewRequest'
        version:
          type: [integer, 'null']
          minimum: 0
          description: Обязательно при обновлении
        period:
          description: >
            Null сохраняет from и to определения; относительный период заменяет их каждый раз при открытии отчёта. SNAPSHOT отклоняет period с 400 VALIDATION_ERROR (поле period): пустое asOf уже означает сегодня
          oneOf:
            - $ref: '#/components/schemas/SavedReportPeriod'
            - type: 'null'
    ReportManagerOption:
      type: object
      required: [id, displayName, active]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        active:
          type: boolean
    SourceCode:
      type: string
      enum: [WEBSITE, MOODLE]
    SyncRun:
      type: object
      required: [id, source, status, fetchedCount, createdCount, updatedCount, skippedCount, needsMappingCount, failedCount,
                 createdAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceCode'
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        updatedSince:
          type: [string, 'null']
          format: date-time
          description: Отметка (watermark), отправляемая источнику как updated_since
        fetchedCount:
          type: integer
          minimum: 0
        createdCount:
          type: integer
          minimum: 0
          description: Применены новые внешние записи; для MOODLE — впервые опубликованные снимки
        updatedCount:
          type: integer
          minimum: 0
          description: >
            Повторно применены известные внешние записи, так как источник прислал более новый updatedAt; для MOODLE — снимки, чьи счётчики изменились
        skippedCount:
          type: integer
          minimum: 0
          description: >
            Повторы уже сохранённой версии, снимки Moodle с неизменившимися счётчиками и записи, которые намеренно не применяются (отозванные, неизвестного типа, группа курса, сопоставленного целиком)
        needsMappingCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        errorCode:
          type: [string, 'null']
          description: >
            Для запусков со статусом FAILED: SOURCE_UNAVAILABLE, SOURCE_UNAUTHORIZED, SOURCE_INVALID_RESPONSE, SYNC_INTERRUPTED или SYNC_FAILED
        errorMessage:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        trigger:
          $ref: '#/components/schemas/SyncTrigger'
        startedByName:
          type: [string, 'null']
          description: Профиль, запустивший запуск; для запусков по расписанию — администратор, от имени которого они выполняются
        organizationName:
          type: [string, 'null']
          description: Организация запуска, начатого из её карточки
    SyncTrigger:
      type: string
      enum: [MANUAL, SCHEDULE, CARD, BOOTSTRAP, UPLOAD]
    RunKind:
      type: string
      description: STUDENTS — занятия обучающихся, учитываются в отчётах; TEACHERS — обучение преподавателей вуза, показывается отдельно и исключается из DEMAND
      enum: [STUDENTS, TEACHERS]
    SyncRunCreated:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
          format: uuid
    DataSource:
      type: object
      required: [source, title, adapterAvailable, configured, proposedContract, problemCount]
      properties:
        source:
          $ref: '#/components/schemas/SourceCode'
        title:
          type: string
        adapterAvailable:
          type: boolean
        configured:
          type: boolean
          description: Конфигурация развёртывания задаёт base URL источника (для MOODLE также токен и разрешённые курсы)
        proposedContract:
          type: boolean
          description: Адаптер следует предложенному контракту, а не контракту, подтверждённому заказчиком
        updatedSince:
          type: [string, 'null']
          format: date-time
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        problemCount:
          type: integer
          minimum: 0
          description: Записи со статусом NEEDS_MAPPING или FAILED
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/SyncRun'
            - type: 'null'
        schedule:
          type: [string, 'null']
          description: Spring cron-выражение SOURCES_SYNC_CRON (московское время); null, если расписание отключено
        nextRunAt:
          type: [string, 'null']
          format: date-time
          description: Следующий запланированный запуск; null, если расписание отключено, источник не настроен либо его ещё не запускал ни один администратор
        stale:
          type: boolean
          description: Настроенный источник без успешного запуска за период SOURCES_STALE_AFTER
    SourceRecord:
      type: object
      required: [id, source, recordType, externalId, externalUpdatedAt, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceCode'
        recordType:
          type: string
          description: >
            partnership_request или learning_application в предложенном контракте сайта; paid_order для оплаченных заказов в формате организатора (загрузка файла или массив с сайта); moodle_course или moodle_group (externalId вида courseId или courseId:groupId) для Moodle
        externalId:
          type: string
        externalUpdatedAt:
          type: string
          format: date-time
        externalStatus:
          type: [string, 'null']
        status:
          type: string
          enum: [APPLIED, NEEDS_MAPPING, FAILED, SKIPPED]
        error:
          type: [string, 'null']
        organizationExternalId:
          type: [string, 'null']
        organizationName:
          type: [string, 'null']
          description: Название организации на сайте; для записей Moodle — название курса или группы
        programName:
          type: [string, 'null']
          description: Название программы на сайте; для paid_order — курс
        streamNo:
          type: [integer, 'null']
          description: Номер потока paid_order
        organizationId:
          type: [string, 'null']
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        interactionId:
          type: [string, 'null']
          format: uuid
        updatedAt:
          type: string
          format: date-time
    SourceRecordApply:
      type: object
      properties:
        organizationId:
          type: [string, 'null']
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        runStartsOn:
          type: [string, 'null']
          format: date
          description: Первый день учебного запуска Moodle; обязателен для записи MOODLE со статусом NEEDS_MAPPING
        runEndsOn:
          type: [string, 'null']
          format: date
          description: День после последнего дня запуска (исключающая граница окончания); позже runStartsOn
        runKind:
          oneOf:
            - $ref: '#/components/schemas/RunKind'
            - type: 'null'
    SourceRecordApplyResult:
      type: object
      required: [record, reappliedCount]
      properties:
        record:
          $ref: '#/components/schemas/SourceRecord'
        reappliedCount:
          type: integer
          minimum: 0
    LearningSnapshotsRefresh:
      type: object
      required: [run, snapshots]
      properties:
        run:
          $ref: '#/components/schemas/SyncRun'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/LearningSnapshot'
    LearningSnapshot:
      type: object
      required: [mappingId, runKind, courseId, courseName, participants, teachers, unknown, groupsCount, observedAt, changedAt]
      properties:
        mappingId:
          type: string
          format: uuid
          description: Учебный запуск (сохранённое сопоставление) снимка
        runKind:
          $ref: '#/components/schemas/RunKind'
        courseId:
          type: integer
          format: int64
        courseName:
          type: string
        groupId:
          type: [integer, 'null']
          format: int64
          description: Устанавливается, когда группа смешанного курса сопоставлена отдельно
        groupName:
          type: [string, 'null']
        participants:
          type: integer
          minimum: 0
          description: Активные зачисления с ролью обучающегося (участия, а не уникальные люди по всем курсам)
        teachers:
          type: integer
          minimum: 0
        completed:
          type: [integer, 'null']
          minimum: 0
          description: null, если завершение курса не отслеживается в Moodle; никогда не заменяется на 0
        notCompleted:
          type: [integer, 'null']
          minimum: 0
        unknown:
          type: integer
          minimum: 0
          description: Участники, по которым Moodle не сообщил статус завершения
        groupsCount:
          type: integer
          minimum: 0
          description: Группы курса, в которых есть обучающиеся; 0 для снимка группы
        runStartsOn:
          type: [string, 'null']
          format: date
          description: Первый день подтверждённого учебного запуска; null для сопоставления, сохранённого без дат запуска
        runEndsOn:
          type: [string, 'null']
          format: date
          description: Исключающая граница окончания учебного запуска; начиная с этого дня снимок не обновляется
        observedAt:
          type: string
          format: date-time
          description: Время последнего успешного наблюдения, а не дата завершения
        changedAt:
          type: string
          format: date-time
          description: Наблюдение, последним изменившее счётчики
    SourceState:
      type: object
