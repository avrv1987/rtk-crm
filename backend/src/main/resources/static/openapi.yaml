  /api/admin/source-records/{id}/apply:
    post:
      tags: [Administration]
      summary: Сопоставить и применить запись источника
      operationId: applySourceRecord
      x-implementation-stage: 4
      description: >
        ADMIN only. For a WEBSITE record saves the optional organization mapping (for the record's external
        organization ID, or its name when the ID is absent) and program mapping (for the program name). For a MOODLE
        NEEDS_MAPPING course or group record organizationId, programId, runStartsOn and runEndsOn are required: the
        mapping confirms a training run [runStartsOn, runEndsOn); a FAILED MOODLE record without them is applied again
        with its saved mapping. A run that ended before its first observation is SKIPPED without a snapshot, a run that
        has ended keeps its last observation. A group cannot be mapped when its course is mapped as a whole and vice
        versa (400). Then applies the stored record again and re-applies up to
        500 other NEEDS_MAPPING records of the same source. Applying an APPLIED or SKIPPED record changes nothing, so
        a repeated request is safe.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRecordApply'
      responses:
        '200':
          description: Record after the new attempt and the number of other records applied thanks to the mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRecordApplyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
