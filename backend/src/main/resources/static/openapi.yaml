    PageCrmProfile:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CrmProfile'
    CatalogImportProfile:
      type: string
      enum: [AGREEMENT, DIRECTION_PROGRAM]
      description: >-
        AGREEMENT loads the ten TZ catalog fields; DIRECTION_PROGRAM loads directions and programs by stable keys.
        Matching rules are described in docs/import.md.
    CatalogImportRowTarget:
      type: object
      description: >-
        Optional explicit record choice for one workbook row. An explicit id takes precedence over external keys
        and names in both preview and apply.
      properties:
        organizationId:
          type: [string, 'null']
          format: uuid
        managerProfileId:
          type: [string, 'null']
          format: uuid
          description: Active USER profile with a team; resolves a manager name shared by several profiles.
        interactionId:
          type: [string, 'null']
          format: uuid
        productAgreementId:
          type: [string, 'null']
          format: uuid
    CatalogImportMapping:
      type: object
      required: [columns]
      properties:
        columns:
          type: object
          description: >-
            Import field to workbook header. AGREEMENT requires organizationName, vendorName and productName and
            accepts contractNumber, licenseSigned, licenseExpiryYear, transferStatus, managerName, contactName,
            comment, organizationType, organizationExternalKey, vendorExternalKey, productExternalKey,
            agreementExternalKey, contactExternalKey, contactPosition, contactEmail, contactPhone and interactionId.
            Missing external keys are derived from normalized names. DIRECTION_PROGRAM requires
            directionExternalKey and directionName and accepts programExternalKey, programName and
            programDirectionRef.
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 255
        rowTargets:
          type: object
          description: Workbook row number (2 or greater) to explicit record ids.
          additionalProperties:
            $ref: '#/components/schemas/CatalogImportRowTarget'
        transferStatuses:
          type: object
          description: >-
            Optional dictionary from a workbook transfer status to the stored value. Without a dictionary the
            normalized workbook value is stored as is.
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 160
    CatalogImportSheet:
      type: object
      required: [name, headers]
      properties:
        name:
          type: string
        headers:
          type: array
          items:
            type: string
    CatalogImportInspect:
      type: object
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/CatalogImportSheet'
    CatalogImportPreview:
      type: object
      required: [jobId, importId]
      properties:
        jobId:
          type: string
          format: uuid
        importId:
          type: string
          format: uuid
    CatalogImportRow:
      type: object
      required: [id, sheetName, rowNumber, status, fieldErrors, oldValues, newValues, applied]
      properties:
        id:
          type: string
          format: uuid
        sheetName:
          type: string
        rowNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [CREATE, UPDATE, UNCHANGED, CONFLICT, INVALID]
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        oldValues:
          type: object
          additionalProperties:
            type: string
        newValues:
          type: object
          additionalProperties:
            type: string
        applied:
          type: boolean
    CatalogImport:
      type: object
      required: [id, profile, status, version, rows, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/CatalogImportProfile'
        status:
          type: string
          enum: [PREVIEWED, APPLIED]
        version:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CatalogImportRow'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CatalogImportApply:
      type: object
      required: [version, confirmedRowIds]
      properties:
        version:
          type: integer
          minimum: 0
        confirmedRowIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    CatalogImportApplyResult:
      type: object
      required: [jobId, importId]
      properties:
        jobId:
          type: string
          format: uuid
        importId:
          type: string
          format: uuid
    CatalogImportJob:
      type: object
      required: [id, importId, action, status, result, createdAt, completedAt]
      properties:
        id:
          type: string
          format: uuid
        importId:
          type: string
          format: uuid
        action:
          type: string
          enum: [PREVIEW, APPLY]
        status:
          type: string
          enum: [SUCCEEDED, FAILED]
        result:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    ReportKind:
      type: string
      description: >
        DEMAND ranks programs by separate sortable measures: applications from the site (learning_application records
        applied from the proposed contract, withdrawn ones excluded), participants from the latest Moodle snapshots of
        training runs (courses and groups mapped with run dates; the period does not apply to them) and parallel runs,
        the number of those training runs whose [runStartsOn, runEndsOn) contains the last day of the period, or the
        report date when the period has no end; a measure without source data is null («нет данных»), not 0; no combined index
        is computed
      enum: [PORTFOLIO, EVENTS, DEMAND]
    ReportFormat:
      type: string
      description: PNG is allowed only for a chart (groupBy set); a chart is exported as PNG or PDF
      enum: [XLSX, XLS, PDF, JSON, PNG]
    PeriodBasis:
      type: string
      description: PORTFOLIO only. CREATED selects interactions created in the period, ACTIVITY those with at least one event in it
      enum: [CREATED, ACTIVITY]
    ReportColumn:
      type: string
      description: >
        PORTFOLIO allows ORGANIZATION, INTERACTION, DIRECTION, PROGRAM, PRODUCTS, STAGE, MANAGER, CREATED_AT,
        LAST_EVENT_AT, NEXT_ACTION, NEXT_ACTION_AT. EVENTS allows EVENT_AT, ORGANIZATION, INTERACTION, EVENT_TYPE,
        FROM_STAGE, STAGE, COMMENT, AUTHOR, MANAGER, DIRECTION, PROGRAM, PRODUCTS. DEMAND allows DIRECTION, PROGRAM,
        APPLICATIONS, PARTICIPANTS, PARALLEL_RUNS.
      enum: [ORGANIZATION, INTERACTION, DIRECTION, PROGRAM, PRODUCTS, STAGE, MANAGER, CREATED_AT, LAST_EVENT_AT,
             NEXT_ACTION, NEXT_ACTION_AT, EVENT_AT, EVENT_TYPE, FROM_STAGE, COMMENT, AUTHOR, APPLICATIONS, PARTICIPANTS,
             PARALLEL_RUNS]
    ReportFilters:
      type: object
      description: >
        An empty list with the include flag false leaves the dimension unfiltered, including rows without a value.
        includeNo* adds rows without the value to the selected ids. managerIds and includeNoManager use the current
        organization owner in PORTFOLIO and DEMAND and the owner snapshot of the event in EVENTS. DEMAND rejects
        productIds, includeNoProduct and stages with 400 VALIDATION_ERROR.
      properties:
        organizationIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        directionIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoDirection:
          type: boolean
        programIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoProgram:
          type: boolean
        productIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoProduct:
          type: boolean
        managerIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoManager:
          type: boolean
        stages:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 200
        organizationType:
          type: [string, 'null']
          enum: [UNIVERSITY, SCHOOL, null]
    ReportPreviewRequest:
      type: object
      required: [kind]
      description: from and to are inclusive dates converted to [from 00:00, to+1 00:00) in Europe/Moscow
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        filters:
          $ref: '#/components/schemas/ReportFilters'
        columns:
          type: array
          description: Omitted or empty means all columns of the kind in the default order
          items:
            $ref: '#/components/schemas/ReportColumn'
        sortBy:
          description: >
            DEMAND only, APPLICATIONS (default), PARTICIPANTS or PARALLEL_RUNS; rows are sorted by that measure
            descending with «нет данных» last, then by program name. Other kinds reject it with 400 VALIDATION_ERROR.
          oneOf:
            - $ref: '#/components/schemas/ReportColumn'
            - type: 'null'
    ReportRequest:
      allOf:
        - $ref: '#/components/schemas/ReportPreviewRequest'
        - type: object
          required: [format]
          properties:
            format:
              $ref: '#/components/schemas/ReportFormat'
            groupBy:
              description: >
                Set to order a chart of the statistics grouped this way instead of the row report; columns are ignored
                and format must be PNG or PDF
              oneOf:
                - $ref: '#/components/schemas/StatisticsGroupBy'
                - type: 'null'
    ReportJobCreated:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid
    ReportJob:
      type: object
      required: [id, kind, format, status, progress, resultReady, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ReportKind'
        format:
          $ref: '#/components/schemas/ReportFormat'
        groupBy:
          description: Grouping of a chart job; null for a row report
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resultReady:
          type: boolean
        rowCount:
          type: [integer, 'null']
          minimum: 0
        fileName:
          type: [string, 'null']
        error:
          type: object
          required: [code, message]
          description: Present for FAILED jobs, e.g. REPORT_ROW_LIMIT, REPORT_XLS_ROW_LIMIT, REPORT_PDF_ROW_LIMIT, REPORT_CHART_LIMIT, REPORT_ACCESS_CHANGED, REPORT_INTERRUPTED, REPORT_FAILED
          properties:
            code:
              type: string
            message:
              type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    ReportColumnView:
      type: object
      required: [id, title, emptyText]
      properties:
        id:
          $ref: '#/components/schemas/ReportColumn'
        title:
          type: string
        emptyText:
          type: string
          description: >
            Text shown for null values, «Не указано» for direction, program, products and manager, «нет данных» for
            APPLICATIONS, PARTICIPANTS and PARALLEL_RUNS
    ReportPreview:
      type: object
      required: [kind, generatedAt, notes, columns, items, page, size, total]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        generatedAt:
          type: string
          format: date-time
        notes:
          type: array
          description: The same generation time, period rule, manager semantics and filter lines as in the file header
          items:
            type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ReportColumnView'
        items:
          type: array
          description: Row objects keyed by column id; dates are ISO 8601 strings, DEMAND measures are integers, missing values are null
          items:
            type: object
            additionalProperties:
              type: [string, integer, 'null']
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
    StatisticsGroupBy:
      type: string
      description: DEMAND sums applications and accepts ORGANIZATION, DIRECTION, PROGRAM, MANAGER and MONTH (month of submission)
      enum: [STAGE, ORGANIZATION, DIRECTION, PROGRAM, PRODUCT, MANAGER, MONTH]
    StatisticsRequest:
      type: object
      required: [kind, groupBy]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        groupBy:
          $ref: '#/components/schemas/StatisticsGroupBy'
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        filters:
          $ref: '#/components/schemas/ReportFilters'
    StatisticsItem:
      type: object
      required: [key, label, count]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
          minimum: 0
    StatisticsResult:
      type: object
      required: [kind, groupBy, unit, timezone, generatedAt, filters, notes, total, unknownCount, items, maxChartBars]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        groupBy:
          $ref: '#/components/schemas/StatisticsGroupBy'
        unit:
          type: string
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        timezone:
          type: string
        generatedAt:
          type: string
          format: date-time
        filters:
          $ref: '#/components/schemas/ReportFilters'
        notes:
          type: array
          items:
            type: string
        total:
          type: integer
          minimum: 0
          description: >
            Number of report rows; for DEMAND the number of applications. PRODUCT counts may add up to more because one
            interaction can have several products
        unknownCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsItem'
        maxChartBars:
          type: integer
          minimum: 1
          description: >
            Largest number of bars a PNG/PDF chart file can hold, counting the «Не указано» bar of DIRECTION, PROGRAM,
            PRODUCT and MANAGER; a larger chart job fails with REPORT_CHART_LIMIT
    ReportManagerOption:
      type: object
      required: [id, displayName, active]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        active:
          type: boolean
    SourceCode:
      type: string
      enum: [WEBSITE, MOODLE]
    SyncRun:
      type: object
      required: [id, source, status, fetchedCount, createdCount, updatedCount, skippedCount, needsMappingCount, failedCount,
                 createdAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceCode'
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        updatedSince:
          type: [string, 'null']
          format: date-time
          description: Watermark sent to the source as updated_since
        fetchedCount:
          type: integer
          minimum: 0
        createdCount:
          type: integer
          minimum: 0
          description: New external records applied; for MOODLE, snapshots published for the first time
        updatedCount:
          type: integer
          minimum: 0
          description: >
            Known external records applied again because the source sent a newer updatedAt; for MOODLE, snapshots whose
            counts changed
        skippedCount:
          type: integer
          minimum: 0
          description: >
            Repeats of an already stored version, Moodle snapshots with unchanged counts and records that are not
            applied by design (withdrawn, unknown type, a group of a course mapped as a whole)
        needsMappingCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        errorCode:
          type: [string, 'null']
          description: >
            For FAILED runs SOURCE_UNAVAILABLE, SOURCE_UNAUTHORIZED, SOURCE_INVALID_RESPONSE, SYNC_INTERRUPTED or
            SYNC_FAILED
        errorMessage:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    SyncRunCreated:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
          format: uuid
    DataSource:
      type: object
      required: [source, title, adapterAvailable, configured, proposedContract, problemCount]
      properties:
        source:
          $ref: '#/components/schemas/SourceCode'
        title:
          type: string
        adapterAvailable:
          type: boolean
        configured:
          type: boolean
          description: The deployment configuration sets the base URL of the source (for MOODLE also the token and the allowed courses)
        proposedContract:
          type: boolean
          description: The adapter follows the proposed contract, not a contract confirmed by the customer
        updatedSince:
          type: [string, 'null']
          format: date-time
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        problemCount:
          type: integer
          minimum: 0
          description: Records with status NEEDS_MAPPING or FAILED
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/SyncRun'
            - type: 'null'
    SourceRecord:
      type: object
      required: [id, source, recordType, externalId, externalUpdatedAt, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceCode'
        recordType:
          type: string
          description: >
            partnership_request or learning_application in the proposed site contract; moodle_course or moodle_group
            (externalId courseId or courseId:groupId) for Moodle
        externalId:
          type: string
        externalUpdatedAt:
          type: string
          format: date-time
        externalStatus:
          type: [string, 'null']
        status:
          type: string
          enum: [APPLIED, NEEDS_MAPPING, FAILED, SKIPPED]
        error:
          type: [string, 'null']
        organizationExternalId:
          type: [string, 'null']
        organizationName:
          type: [string, 'null']
          description: Organization name on the site; for Moodle records the course or group label
        programName:
          type: [string, 'null']
        organizationId:
          type: [string, 'null']
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        interactionId:
          type: [string, 'null']
          format: uuid
        updatedAt:
          type: string
          format: date-time
    SourceRecordApply:
      type: object
      properties:
        organizationId:
          type: [string, 'null']
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        runStartsOn:
          type: [string, 'null']
          format: date
          description: First day of the Moodle training run; required for a MOODLE NEEDS_MAPPING record
        runEndsOn:
          type: [string, 'null']
          format: date
          description: Day after the last day of the run (exclusive end); later than runStartsOn
    SourceRecordApplyResult:
      type: object
      required: [record, reappliedCount]
      properties:
        record:
          $ref: '#/components/schemas/SourceRecord'
        reappliedCount:
          type: integer
          minimum: 0
    LearningSnapshotsRefresh:
      type: object
      required: [run, snapshots]
      properties:
        run:
          $ref: '#/components/schemas/SyncRun'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/LearningSnapshot'
    LearningSnapshot:
      type: object
      required: [courseId, courseName, participants, teachers, unknown, groupsCount, observedAt, changedAt]
      properties:
        courseId:
          type: integer
          format: int64
        courseName:
          type: string
        groupId:
          type: [integer, 'null']
          format: int64
          description: Set when a group of a mixed course is mapped on its own
        groupName:
          type: [string, 'null']
        participants:
          type: integer
          minimum: 0
          description: Active enrolments with a learner role (participations, not unique people across courses)
        teachers:
          type: integer
          minimum: 0
        completed:
          type: [integer, 'null']
          minimum: 0
          description: null when course completion is not tracked in Moodle; never replaced by 0
        notCompleted:
          type: [integer, 'null']
          minimum: 0
        unknown:
          type: integer
          minimum: 0
          description: Participants whose completion status Moodle did not report
        groupsCount:
          type: integer
          minimum: 0
          description: Groups of the course that have learners; 0 for a group snapshot
        runStartsOn:
          type: [string, 'null']
          format: date
          description: First day of the confirmed training run; null for a mapping saved without run dates
        runEndsOn:
          type: [string, 'null']
          format: date
          description: Exclusive end of the training run; the snapshot is not updated from this day on
        observedAt:
          type: string
          format: date-time
          description: Time of the last successful observation, not a completion date
        changedAt:
          type: string
          format: date-time
          description: Observation that last changed the counts
    SourceMappingOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SourceMappingOptions:
      type: object
      required: [organizations, programs]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/SourceMappingOption'
        programs:
          type: array
          items:
            $ref: '#/components/schemas/SourceMappingOption'
security:
  - cookieAuth: []
