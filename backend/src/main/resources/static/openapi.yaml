  /api/admin/source-records/{id}/apply:
    post:
      tags: [Administration]
      summary: Сопоставить и применить запись источника
      operationId: applySourceRecord
      x-implementation-stage: 4
      description: >
        Только ADMIN. Для записи WEBSITE сохраняет опциональное сопоставление организации (по внешнему ID организации записи либо по её имени, если ID отсутствует) и сопоставление программы (по имени программы). Для записи курса или группы MOODLE со статусом NEEDS_MAPPING обязательны organizationId, programId, runStartsOn и runEndsOn: сопоставление подтверждает учебный запуск [runStartsOn, runEndsOn); запись MOODLE со статусом FAILED без них применяется заново с её сохранённым сопоставлением. Запуск, завершившийся до своего первого наблюдения, получает статус SKIPPED без снимка, завершённый запуск сохраняет своё последнее наблюдение. Группу нельзя сопоставить, если её курс сопоставлен целиком, и наоборот (400). Затем сохранённая запись применяется заново, и повторно применяются до 500 других записей того же источника со статусом NEEDS_MAPPING. Применение записи со статусом APPLIED или SKIPPED ничего не меняет, поэтому повторный запрос безопасен.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRecordApply'
      responses:
        '200':
          description: Запись после новой попытки и число других записей, применённых благодаря сопоставлению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRecordApplyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/audit-events:
