        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Interaction]
      summary: Изменить план и данные взаимодействия
      operationId: updateInteractionPlan
      x-implementation-stage: 3
      description: >-
        Changes the plan of the card (next step, its due date, program and products) and its details (title, date of
        the last contact, linked contacts). An absent property keeps the current value, an explicit null clears it;
        the title cannot be cleared. contactIds replaces the linked contacts; newly linked contacts must belong to the
        organization and must not be inactive. Removing a product whose agreement already has contract data is
        rejected. A change writes one history event: DETAILS_UPDATED when the title, the last contact or the linked
        contacts changed, otherwise PLAN_UPDATED; its comment lists previous and new values. Added and removed contacts
        are stored as references and named from the current contact record when history or a report is read, so a
        renamed or anonymised contact never keeps its former name in the event. A request without effective changes
        returns the card unchanged.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionPlanUpdate'
      responses:
        '200':
          description: Interaction after the plan update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
