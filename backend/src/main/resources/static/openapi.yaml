openapi: 3.1.0
info:
  title: CRM ИТ Школы РТК — REST API
  version: 0.2.0
  description: |
    API веб-клиента CRM и точка интеграции с корпоративными системами.

    Аутентификация: вход через Keycloak (GET /api/auth/login) создаёт серверную сессию BFF, браузер получает HttpOnly cookie SESSION; токены OIDC клиенту не передаются. Выход (POST /api/auth/logout) завершает сессию CRM и возвращает адрес завершения сессии Keycloak.

    Изменяющие запросы передают заголовок X-CSRF-TOKEN со значением token из GET /api/csrf. Команды передают Idempotency-Key; повтор с тем же ключом и телом возвращает прежний результат, с другим телом — 409 IDEMPOTENCY_CONFLICT. Устаревшая version даёт 409 VERSION_CONFLICT с currentVersion.

    Ошибки возвращаются в формате ApiError {code, message, requestId}. requestId совпадает с заголовком X-Request-Id и записью в журнале сервера; stack trace и секреты в ответ не попадают.
servers:
  - url: /
tags:
  - name: Session
  - name: Catalog
  - name: Interaction
  - name: Jobs
  - name: Reports
  - name: Administration
paths:
  /api/auth/login:
    get:
      tags: [Session]
      summary: Начать вход через Keycloak
      operationId: startLogin
      security: []
      responses:
        '302':
          description: Redirect to the BFF authorization endpoint, which redirects to the configured OIDC provider
          headers:
            Location:
              description: Browser redirect target at the OIDC provider
              required: true
              schema:
                type: string
                format: uri-reference
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/callback/{registrationId}:
    get:
      tags: [Session]
      summary: Завершить вход через Keycloak
      operationId: finishLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: BFF session is established and the browser is redirected to the SPA
          headers:
            Location:
              description: Browser redirect target in the SPA
              required: true
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [Session]
      summary: Выйти из CRM и Keycloak
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: BFF session and browser cookies are cleared; the browser opens logoutUrl to end the Keycloak session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      tags: [Session]
      summary: Текущий профиль CRM
      operationId: getCurrentProfile
      responses:
        '200':
          description: Active CRM profile for the authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/csrf:
    get:
      tags: [Session]
      summary: Получить CSRF-токен сессии
      operationId: getCsrfToken
      responses:
        '200':
          description: Token and header name for the current BFF session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations:
    get:
      tags: [Catalog]
      summary: Список организаций
      operationId: listOrganizations
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/OrganizationSort'
        - name: q
          in: query
          required: false
          description: Часть названия без учёта регистра
          schema:
            type: string
            maxLength: 200
        - name: requiresAssignment
          in: query
          required: false
          description: Только вузы без ответственного или с ответственным, который не является активным КАМ команды вуза
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Organizations visible within the current server-side business scope, filtered and counted on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}:
    get:
      tags: [Catalog]
      summary: Карточка организации
      operationId: getOrganization
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Organization visible within the current server-side business scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/contacts:
    get:
      tags: [Catalog]
      summary: Контакты организации
      operationId: listOrganizationContacts
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Contacts belonging to the visible organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      summary: Добавить контакт организации
      operationId: createOrganizationContact
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '201':
          description: Contact created in the visible organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment-options:
    get:
      tags: [Catalog]
      summary: Кандидаты в ответственные КАМ
      operationId: listOrganizationAssignmentOptions
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Active USER profiles of the visible organization's team, available only to its LEADER
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAssignmentCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment-events:
    get:
      tags: [Catalog]
      summary: История назначений ответственного
      operationId: listOrganizationAssignmentEvents
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Immutable owner assignment history of the visible organization, available only to its LEADER
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAssignmentEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organizations/{id}/assignment:
    post:
      tags: [Catalog]
      summary: Назначить ответственного КАМ
      operationId: assignOrganizationOwner
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationAssignment'
      responses:
        '200':
          description: Updated organization and its immutable owner assignment event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAssignmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/programs:
    get:
      tags: [Catalog]
      summary: Справочник программ
      operationId: listPrograms
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Active programs available in the current business catalog scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCatalogLookup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/products:
    get:
      tags: [Catalog]
      summary: Справочник продуктов
      operationId: listProducts
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Active products available in the current business catalog scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCatalogLookup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/directions:
    get:
      tags: [Catalog]
      summary: Список ИТ-направлений
      operationId: listDirections
      x-implementation-stage: 5
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Active IT directions for report filters; empty for profiles without a business scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCatalogLookup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/interactions:
    get:
      tags: [Interaction]
      summary: Взаимодействия видимых вузов
      operationId: listInteractions
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/InteractionOrganizationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/InteractionSort'
        - name: q
          in: query
          required: false
          description: Часть названия взаимодействия или вуза без учёта регистра
          schema:
            type: string
            maxLength: 200
        - name: due
          in: query
          required: false
          description: OVERDUE — шаг и срок заданы, срок прошёл; THIS_WEEK — шаг и срок заданы, срок на текущей неделе по Москве (понедельник–воскресенье); NO_NEXT_STEP — нет текста шага или его срока, такие взаимодействия попадают только сюда
          schema:
            type: string
            enum: [OVERDUE, THIS_WEEK, NO_NEXT_STEP]
        - name: stage
          in: query
          required: false
          description: Точное название текущего этапа
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Interactions of all visible organizations, or of one visible organization when organizationId is given; filters, total and pages are computed on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInteraction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Interaction]
      summary: Создать взаимодействие
      operationId: createInteraction
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionCreate'
      responses:
        '201':
          description: Interaction created with a private 13-stage workflow snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/interactions/{id}:
    get:
      tags: [Interaction]
      summary: Карточка взаимодействия
      operationId: getInteraction
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Interaction visible through its current organization scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Interaction]
      summary: Изменить план взаимодействия
      operationId: updateInteractionPlan
      x-implementation-stage: 3
      description: >-
        Changes the plan of the card: next step, its due date, program and products.
        An absent property keeps the current value, an explicit null clears it.
        Removing a product whose agreement already has contract data is rejected.
        A change writes one PLAN_UPDATED history event; a request without effective changes returns the card unchanged.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionPlanUpdate'
      responses:
        '200':
          description: Interaction after the plan update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/interactions/{id}/events:
    get:
      tags: [Interaction]
      summary: История взаимодействия
      operationId: listInteractionEvents
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Immutable interaction history ordered by version, occurredAt and id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InteractionEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/interactions/{id}/learning-snapshots:
    get:
      tags: [Interaction]
      summary: Данные обучения из LMS для взаимодействия
      operationId: listInteractionLearningSnapshots
      x-implementation-stage: 4
      description: >
        Latest Moodle snapshots of the courses and groups an administrator mapped to the same organization and program
        as the interaction. Counts only: no names, emails or grades of learners are stored. The interaction is checked
        against the current organization scope in the same query; an invisible or unknown interaction gets 404.
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Snapshots ordered by course and group; empty when nothing is mapped to the interaction program
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/interactions/{id}/learning-snapshots/sync:
    post:
      tags: [Interaction]
      summary: Обновить данные LMS карточки
      operationId: refreshInteractionLearningSnapshots
      x-implementation-stage: 4
      description: >
        USER or LEADER of the interaction scope. Reads from Moodle only the allowed courses that an administrator already
        mapped to the organization and program of the interaction and applies only the courses and groups mapped to that
        pair, in the request thread and under the same one-active-run rule as the administrator sync. The Moodle token
        stays on the server. A changed snapshot adds a «Данные LMS» event authored by the caller; unchanged counts only
        get a new observation time. A Moodle error keeps the last full publication and returns 502 LMS_SYNC_FAILED.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Finished scoped run and the refreshed snapshots of the interaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSnapshotsRefresh'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            LMS_NOT_MAPPED when the interaction has no program or no allowed Moodle course or group is mapped to its
            organization and program; SOURCE_NOT_CONFIGURED; SYNC_ALREADY_RUNNING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: LMS_SYNC_FAILED, Moodle was unavailable or rejected the request; stored snapshots are unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/interactions/{id}/transitions:
    post:
      tags: [Interaction]
      summary: Перевести взаимодействие на этап
      operationId: transitionInteraction
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionTransition'
      responses:
        '200':
          description: Interaction after a validated workflow transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/interactions/{id}/comments:
    post:
      tags: [Interaction]
      summary: Добавить комментарий к взаимодействию
      operationId: commentInteraction
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionComment'
      responses:
        '200':
          description: Updated interaction and the immutable comment event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionCommentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/interactions/{id}/stage-edits:
    post:
      tags: [Interaction]
      summary: Изменить этапы взаимодействия
      operationId: editInteractionStages
      x-implementation-stage: 3
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionStageEdit'
      responses:
        '200':
          description: >-
            Interaction after a validated local workflow snapshot edit. Structural edits rebuild only the
