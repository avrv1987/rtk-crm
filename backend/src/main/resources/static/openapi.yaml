          description: The mapping after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Administration]
      summary: Снять сопоставление источника
      operationId: removeSourceMapping
      x-implementation-stage: 4
      description: >
        ADMIN only, with version. A Moodle run is removed with its snapshot, so its numbers leave cards and reports; the
        course and group records are evaluated again and return to review when nothing maps them. Site records resolved
        through a removed university or program mapping return to NEEDS_MAPPING; history events stay.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '204':
          description: Mapping removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/source-mappings/{id}/runs:
    post:
      tags: [Administration]
      summary: Добавить поток на сопоставленный курс
      operationId: addSourceMappingRun
      x-implementation-stage: 4
      description: >
        ADMIN only. Adds another training run with new dates to the same Moodle course or group (for a new cycle);
        runs of one course or group follow each other and must not overlap (400). An observation is published into the
        earliest run that has not ended on its date; a run that ended keeps its last snapshot.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceMappingUpdate'
      responses:
        '201':
          description: The new run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/source-mappings/{id}/snapshot:
    delete:
      tags: [Administration]
      summary: Удалить устаревший снимок потока
      operationId: deleteSourceMappingSnapshot
      x-implementation-stage: 4
      description: >
        ADMIN only. Deletes the stored snapshot of a Moodle run and keeps the mapping, for example after the group was
        deleted in Moodle. The next sync publishes the run again if Moodle still returns it. 400 when the run has no snapshot.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Snapshot deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/source-records/{id}/organization:
    post:
      tags: [Administration]
      summary: Создать организацию из записи разбора
      operationId: createOrganizationFromAdminSourceRecord
      x-implementation-stage: 4
      description: Same as /api/source-records/{id}/organization for ADMIN; teamId is required
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceOrganizationCreate'
      responses:
        '201':
          description: Created organization and the record after the new attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceOrganizationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: Серверная сессия BFF, созданная входом через GET /api/auth/login. Swagger UI на том же origin использует сессию браузера.
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        enum: [keycloak]
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CatalogLookupState:
      name: state
      in: query
      required: false
      description: Отбор по архиву; форма нового взаимодействия берёт действующие записи, фильтры отчётов — все с отметкой архива
      schema:
        type: string
        enum: [ACTIVE, ARCHIVED, ALL]
        default: ACTIVE
    OrganizationSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['name,asc', 'name,desc', 'updatedAt,asc', 'updatedAt,desc']
        default: 'updatedAt,desc'
    InteractionOrganizationId:
      name: organizationId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    InteractionSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['createdAt,asc', 'createdAt,desc', 'updatedAt,asc', 'updatedAt,desc', 'nextActionAt,asc']
        default: 'updatedAt,desc'
    WorkflowTemplateSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['name,asc', 'name,desc', 'version,asc', 'version,desc']
        default: 'name,asc'
    CrmProfileSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['displayName,asc', 'displayName,desc', 'role,asc', 'role,desc', 'accessRevision,asc', 'accessRevision,desc']
        default: 'displayName,asc'
    AgreementConfirmationOrganization:
      name: organizationId
      in: query
      required: false
      description: Visible organization; a hidden one returns 404
      schema:
        type: string
        format: uuid
    AgreementConfirmationAgreement:
      name: agreementId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AgreementConfirmationKind:
      name: kindId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AgreementConfirmationFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
    AgreementConfirmationTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Значение token из GET /api/csrf для текущей сессии. Без заголовка или с чужим значением запрос отклоняется с 403 FORBIDDEN.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: Validation or request format error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: BFF session is absent or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated identity is not allowed to perform the action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CrmProfileRequired:
      description: The OIDC identity has no active CRM profile (CRM_PROFILE_REQUIRED) or its profile created at first login waits for administrator activation (CRM_PROFILE_PENDING)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ContactInteractionMutationForbidden:
      description: A visible organization or interaction can be changed only by an active USER or LEADER of its scope; the scope is checked first, so a hidden object is 404. Also returned when the OIDC identity has no active CRM profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Object does not exist or is outside the current server-side scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Version or idempotency conflict; VERSION_CONFLICT includes currentVersion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Uploaded payload exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DependencyUnavailable:
      description: Required dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Unexpected server error; the stack trace is written only to the server log under the same requestId
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ConfirmationLimit:
      description: >
        CONFIRMATION_LIMIT, the selection has more than 500 documents or, for the archive, its CLEAN files exceed
        app.agreements.archive-max-size; narrow the period, university or kind
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReportCapacityExceeded:
      description: REPORT_CAPACITY_EXCEEDED, all report slots and the bounded queue are busy; nothing was stored
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReportGone:
      description: REPORT_ACCESS_CHANGED after a role, team or access revision change, or REPORT_RESULT_UNAVAILABLE when the file is gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    AgreementStatus:
      type: string
      description: DRAFT проект, ACTIVE действует, COMPLETED завершено, TERMINATED расторгнуто
      enum: [DRAFT, ACTIVE, COMPLETED, TERMINATED]
    AgreementActivityStatus:
      type: string
      description: PLANNED запланировано, IN_PROGRESS выполняется, DONE выполнено, CANCELLED отменено
      enum: [PLANNED, IN_PROGRESS, DONE, CANCELLED]
    AgreementActivityKind:
      type: object
      required: [id, name, sortOrder, archived, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        sortOrder:
          type: integer
        archived:
          type: boolean
        version:
          type: integer
          minimum: 0
    AgreementActivityKindCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    AgreementActivityKindUpdate:
      type: object
      required: [version, name, archived]
      properties:
        version:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 200
        archived:
          type: boolean
    AgreementSummary:
      type: object
      required: [id, organizationId, number, concludedOn, validUntil, status, activityCount, confirmationCount, version]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        number:
          type: string
        concludedOn:
          type: [string, 'null']
          format: date
        validUntil:
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/AgreementStatus'
        activityCount:
          type: integer
          minimum: 0
        confirmationCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
    AgreementInput:
      type: object
      required: [number, status]
      properties:
        version:
          type: [integer, 'null']
          minimum: 0
          description: Required when updating
        number:
          type: string
          minLength: 1
          maxLength: 100
        concludedOn:
          type: [string, 'null']
          format: date
        validUntil:
          type: [string, 'null']
          format: date
          description: Last day of the term; not earlier than concludedOn
        parties:
          type: [string, 'null']
          maxLength: 2000
          description: Parties and signatories
        status:
          $ref: '#/components/schemas/AgreementStatus'
        fileAttachmentId:
          type: [string, 'null']
          format: uuid
          description: CLEAN document from a work of the same organization holding the signed agreement
    Agreement:
      type: object
      required: [id, organizationId, organizationName, number, concludedOn, validUntil, parties, status, file, version,
                 createdAt, updatedAt, activities]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        number:
          type: string
        concludedOn:
          type: [string, 'null']
          format: date
        validUntil:
          type: [string, 'null']
          format: date
        parties:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AgreementStatus'
        file:
          oneOf:
            - $ref: '#/components/schemas/AgreementLinkedDocument'
            - type: 'null'
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activities:
          type: array
          items:
            $ref: '#/components/schemas/AgreementActivity'
    AgreementActivity:
      type: object
      required: [id, agreementId, kindId, kindName, title, unit, plannedVolume, actualVolume, plannedStart, plannedEnd,
                 actualStart, actualEnd, responsibleProfileId, responsibleName, status, version, interactions, attachments]
      properties:
        id:
          type: string
          format: uuid
        agreementId:
          type: string
          format: uuid
        kindId:
          type: string
          format: uuid
        kindName:
          type: string
        title:
          type: string
        unit:
          type: [string, 'null']
        plannedVolume:
          type: [integer, 'null']
          minimum: 0
        actualVolume:
          type: [integer, 'null']
          minimum: 0
        plannedStart:
          type: [string, 'null']
          format: date
        plannedEnd:
          type: [string, 'null']
          format: date
        actualStart:
          type: [string, 'null']
          format: date
        actualEnd:
          type: [string, 'null']
          format: date
        responsibleProfileId:
          type: [string, 'null']
          format: uuid
        responsibleName:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AgreementActivityStatus'
        version:
          type: integer
          minimum: 0
        interactions:
          type: array
          items:
            $ref: '#/components/schemas/AgreementLinkedWork'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AgreementLinkedDocument'
    AgreementActivityInput:
      type: object
      required: [kindId, title, status]
      properties:
        version:
          type: [integer, 'null']
          minimum: 0
          description: Required when updating
        kindId:
          type: string
          format: uuid
          description: Active kind; an archived kind is accepted only if the activity already has it
        title:
          type: string
          minLength: 1
          maxLength: 300
        unit:
          type: [string, 'null']
          maxLength: 50
        plannedVolume:
          type: [integer, 'null']
          minimum: 0
        actualVolume:
          type: [integer, 'null']
          minimum: 0
        plannedStart:
          type: [string, 'null']
          format: date
        plannedEnd:
          type: [string, 'null']
          format: date
        actualStart:
          type: [string, 'null']
          format: date
        actualEnd:
          type: [string, 'null']
          format: date
        responsibleProfileId:
          type: [string, 'null']
          format: uuid
          description: Active USER or LEADER of the organization team
        status:
          $ref: '#/components/schemas/AgreementActivityStatus'
        interactionIds:
          type: array
          maxItems: 100
          description: Works of the same organization; the list replaces the current links
          items:
            type: string
            format: uuid
        attachmentIds:
          type: array
          maxItems: 100
          description: CLEAN documents of works of the same organization; the list replaces the current links
          items:
            type: string
            format: uuid
    AgreementLinkedWork:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
    AgreementLinkedDocument:
      type: object
      required: [id, originalName, interactionId, interactionTitle, stageName, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        interactionId:
          type: string
          format: uuid
        interactionTitle:
          type: string
        stageName:
          type: string
        status:
          type: string
          enum: [QUARANTINE, CLEAN, REJECTED, UNVERIFIABLE]
        createdAt:
          type: string
          format: date-time
    AgreementResponsible:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    AgreementOptions:
      type: object
      required: [interactions, attachments, responsibles]
      properties:
        interactions:
          type: array
          items:
            $ref: '#/components/schemas/AgreementLinkedWork'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AgreementLinkedDocument'
        responsibles:
          type: array
          items:
            $ref: '#/components/schemas/AgreementResponsible'
    AgreementConfirmation:
      type: object
      required: [organizationId, organizationName, agreementId, agreementNumber, activityId, activityTitle, kindId, kindName,
                 activityStart, activityEnd, attachmentId, originalName, sizeBytes, status, createdAt, interactionTitle]
      properties:
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        agreementId:
          type: string
          format: uuid
        agreementNumber:
          type: string
        activityId:
          type: string
          format: uuid
        activityTitle:
          type: string
        kindId:
          type: string
          format: uuid
        kindName:
          type: string
        activityStart:
          type: [string, 'null']
          format: date
        activityEnd:
          type: [string, 'null']
          format: date
        attachmentId:
          type: string
          format: uuid
        originalName:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [QUARANTINE, CLEAN, REJECTED, UNVERIFIABLE]
        createdAt:
          type: string
          format: date-time
        interactionTitle:
          type: string
    Me:
      type: object
      required: [id, role, teamId, teamName, accessRevision]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [USER, LEADER, ADMIN, MANAGEMENT]
        teamId:
          type: [string, 'null']
          format: uuid
        teamName:
          type: [string, 'null']
        accessRevision:
          type: integer
          minimum: 0
    LogoutResult:
      type: object
      required: [logoutUrl]
      properties:
        logoutUrl:
          type: string
          format: uri
          description: Keycloak end_session_endpoint with id_token_hint and post_logout_redirect_uri
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 1
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - BAD_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - CRM_PROFILE_REQUIRED
            - CRM_PROFILE_PENDING
            - LAST_ACTIVE_ADMIN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - VERSION_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - INTERNAL_ERROR
            - DEPENDENCY_UNAVAILABLE
            - REPORT_NOT_READY
            - REPORT_ACCESS_CHANGED
            - REPORT_RESULT_UNAVAILABLE
            - REPORT_CAPACITY_EXCEEDED
            - SOURCE_NOT_CONFIGURED
            - SYNC_ALREADY_RUNNING
            - SYNC_CAPACITY_EXCEEDED
            - LMS_NOT_MAPPED
            - LMS_SYNC_FAILED
            - ACCOUNT_SYNC_FAILED
            - PERSONAL_DATA_ANONYMIZED
            - PROFILE_ACTIVE
            - RETENTION_RUNNING
            - CONFIRMATION_LIMIT
        message:
          type: string
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        currentVersion:
          type: integer
          minimum: 0
    Job:
      type: object
      required: [id, status, resultReady]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        resultReady:
          type: boolean
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Organization:
      type: object
      required: [id, name, type, teamId, version, updatedAt, ownerManagerName, teamName, requiresAssignment, status, city, website, inn, inherited, deputyManagerName, deputyEndsOn]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [UNIVERSITY, SCHOOL, COLLEGE]
        teamId:
          type: string
          format: uuid
        ownerManagerId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        ownerManagerName:
          type: [string, 'null']
        teamName:
          type: [string, 'null']
        requiresAssignment:
          type: boolean
          description: true, если ответственного нет или он не является активным КАМ или руководителем команды вуза
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        city:
          type: [string, 'null']
        website:
          type: [string, 'null']
        inn:
          type: [string, 'null']
        inherited:
          type: boolean
          description: true, если вуз ранее вёл другой КАМ и текущий ответственный после получения вуза ещё не подтвердил ни одного контакта («Контакт подтверждён»)
