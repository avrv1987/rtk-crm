  /api/admin/sources/{source}/sync:
    post:
      tags: [Administration]
      summary: Запустить синхронизацию источника
      operationId: startSourceSync
      x-implementation-stage: 4
      description: >
        ADMIN only. Persists a PENDING run and hands it to the bounded sync executor (not the HTTP thread); returns 202
        with runId. Only one PENDING or RUNNING run per source exists: a second start gets 409 SYNC_ALREADY_RUNNING.
        Repeating a sync is safe: a site record with the same source, type, externalId and updatedAt is skipped, and a
        Moodle snapshot with unchanged counts only gets a new observation time. A source error fails the run and leaves
        stored records, published Moodle snapshots, demand numbers and the updated_since watermark intact.
        The same runs are started by the server schedule SOURCES_SYNC_CRON on behalf of the active administrator who
        started the latest run of the source; a source nobody started yet is not scheduled.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SourceCode'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Sync run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >
            SOURCE_NOT_CONFIGURED when SITE_BASE_URL is empty, or MOODLE_BASE_URL, MOODLE_TOKEN or MOODLE_COURSE_IDS is
            empty; SYNC_ALREADY_RUNNING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: SYNC_CAPACITY_EXCEEDED, the sync executor and its queue are busy; nothing was stored
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
