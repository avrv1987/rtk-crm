        managerCandidates:
          type: array
          description: Активные КАМ с одинаковым ФИО для выбора в строке протокола; выбор передаётся через rowTargets
          items:
            $ref: '#/components/schemas/CatalogImportManagerCandidate'
    CatalogImport:
      type: object
      required: [id, profile, status, version, rows, createdAt, updatedAt, missingRecords]
      properties:
        id:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/CatalogImportProfile'
        status:
          type: string
          enum: [PREVIEWED, APPLIED]
        version:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CatalogImportRow'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        missingRecords:
          type: array
          description: >-
            Действующие договоры вузов из файла, продуктов которых нет в загруженном реестре; пусто после применения
          items:
            $ref: '#/components/schemas/CatalogImportMissingRecord'
    CatalogImportApply:
      type: object
      required: [version, confirmedRowIds]
      description: Нужна хотя бы одна строка или одна запись для архивирования
      properties:
        version:
          type: integer
          minimum: 0
        confirmedRowIds:
          type: array
          items:
            type: string
            format: uuid
        archiveAgreementIds:
          type: array
          description: Договоры из missingRecords, которые администратор подтвердил архивировать
          items:
            type: string
            format: uuid
    CatalogImportApplyResult:
      type: object
      required: [jobId, importId]
      properties:
        jobId:
          type: string
          format: uuid
        importId:
          type: string
          format: uuid
    CatalogImportJob:
      type: object
      required: [id, importId, action, status, result, createdAt, completedAt]
      properties:
        id:
          type: string
          format: uuid
        importId:
          type: string
          format: uuid
        action:
          type: string
          enum: [PREVIEW, APPLY]
        status:
          type: string
          enum: [SUCCEEDED, FAILED]
        result:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    ReportKind:
      type: string
      description: >
        DEMAND ranks programs by separate sortable measures: applications from the site (learning_application records
        applied from the proposed contract, withdrawn ones excluded), participants from the latest Moodle snapshots of
        student training runs (courses and groups mapped with run dates) that overlap the period by at least one day,
        the last observation of an open run or the last one before the end of a closed run; teacher training runs are
        excluded; completed participants are summed over runs with completion tracking; and parallel runs,
        the number of those training runs whose [runStartsOn, runEndsOn) contains the last day of the period, or the
        report date when the period has no end; a measure without source data is null («нет данных»), not 0; no combined index
        is computed. EVENTS also lists assignment, reassignment and removal of the organization KAM as rows without an
        interaction to LEADER only, like the assignment history of the organization card; USER gets interaction events
        only. SNAPSHOT shows interactions created before the end of asOf with the stage of the last transition and
        the organization KAM restored from assignment history at that date; from and to are rejected. DURATION groups by
        team, program and stage the average and maximum days of stage stays and of the whole cycle (creation until the
        first entry into the last stage of the route) completed in the period, plus stays still open at the period end. AGREEMENTS has one row per activity of an agreement plan (an agreement without activities gives one
        row): the period selects activities whose actual dates, otherwise planned dates, otherwise the agreement term
        intersect it; MANAGER is the activity responsible, PARTICIPANTS sums Moodle participations of the programs of
        linked works, counting only training runs whose [runStartsOn, runEndsOn) overlaps both the activity dates and
        the report period; only organizationIds, organizationType, managerIds and includeNoManager filters apply and no
        chart is built
      enum: [PORTFOLIO, EVENTS, DEMAND, SNAPSHOT, DURATION, AGREEMENTS]
    ReportFormat:
      type: string
      description: PNG is allowed only for a chart (groupBy set); a chart is exported as PNG or PDF
      enum: [XLSX, XLS, PDF, JSON, PNG]
    PeriodBasis:
      type: string
      description: >
        PORTFOLIO only. CREATED selects interactions created in the period, ACTIVITY those with at least one event in
        it, ACTIVE those created before the end of the period and not completed before its start (the work status is not
        taken into account yet, so every interaction created before the end is active)
      enum: [CREATED, ACTIVITY, ACTIVE]
    ChartType:
      type: string
      description: BAR (default) for horizontal bars, LINE for a line chart of MONTH grouping
      enum: [BAR, LINE]
    ReportEventType:
      type: string
      description: >
        EVENTS filter; ASSIGNMENT covers assignment, reassignment and removal of the organization KAM and selects rows
        for LEADER only (USER gets no rows for it)
      enum: [CREATED, TRANSITIONED, COMMENTED, STAGES_EDITED, PLAN_UPDATED, DETAILS_UPDATED, STATUS_CHANGED,
             AGREEMENT_UPDATED, ATTACHMENT_DELETED, STAGE_COMPLETED, STAGE_COMPLETION_CLEARED, ASSIGNMENT]
    InteractionFlag:
      type: string
      description: WAITING_UNIVERSITY — ждём ответа вуза; WAITING_RTK — ждём действия РТК; PROBLEM — отмечена проблема; RISK — отмечен риск любого уровня
      enum: [WAITING_UNIVERSITY, WAITING_RTK, PROBLEM, RISK]
    ReportColumn:
      type: string
      description: >
        PORTFOLIO allows ORGANIZATION, INTERACTION, DIRECTION, PROGRAM, PRODUCTS, STAGE, DAYS_ON_STAGE, WORK_STATUS, WAITING,
        PROBLEM, RISK, MANAGER, CREATED_AT, LAST_EVENT_AT, NEXT_ACTION, NEXT_ACTION_AT, VENDORS, CONTRACT_NUMBER,
        LICENSE_SIGNED, LICENSE_EXPIRY_YEAR, TRANSFER_STATUS, MATERIALS_TRANSFERRED_ON; DAYS_ON_STAGE is the number of whole
        days from the last entry into the current stage (creation when the card never entered it by a transition) until the
        report is generated; agreement columns show the value itself for one product and «product: value» pairs for several
        products. EVENTS allows EVENT_AT, ORGANIZATION, INTERACTION, EVENT_TYPE,
        FROM_STAGE, STAGE, COMMENT, AUTHOR, MANAGER, DIRECTION, PROGRAM, PRODUCTS. DEMAND allows DIRECTION, PROGRAM,
        APPLICATIONS, PARTICIPANTS, LEARNERS_COMPLETED, PARALLEL_RUNS; DEMAND column titles carry the application period,
        the latest Moodle observation and the parallel-runs date. SNAPSHOT allows ORGANIZATION, INTERACTION, DIRECTION, PROGRAM,
        PRODUCTS, STAGE, MANAGER, CREATED_AT, LAST_EVENT_AT. DURATION allows TEAM, PROGRAM, STAGE, COMPLETED, AVG_DAYS,
        MAX_DAYS, CURRENT, CURRENT_MAX_DAYS; days are decimal numbers with one fractional digit. AGREEMENTS allows ORGANIZATION,
        AGREEMENT, AGREEMENT_STATUS, AGREEMENT_TERM, ACTIVITY_KIND, ACTIVITY, PLANNED_VOLUME, ACTUAL_VOLUME, VOLUME_UNIT,
        PLANNED_DATES, ACTUAL_DATES, MANAGER, ACTIVITY_STATUS, PARTICIPANTS, WORKS, CONFIRMATIONS, CONFIRMATION_LINKS.
      enum: [ORGANIZATION, INTERACTION, DIRECTION, PROGRAM, PRODUCTS, STAGE, DAYS_ON_STAGE, WORK_STATUS, WAITING, PROBLEM, RISK,
             MANAGER, CREATED_AT, LAST_EVENT_AT, NEXT_ACTION, NEXT_ACTION_AT, EVENT_AT, EVENT_TYPE, FROM_STAGE, COMMENT, AUTHOR,
             APPLICATIONS, PARTICIPANTS, LEARNERS_COMPLETED, PARALLEL_RUNS, VENDORS, CONTRACT_NUMBER, LICENSE_SIGNED, LICENSE_EXPIRY_YEAR,
             TRANSFER_STATUS, MATERIALS_TRANSFERRED_ON, TEAM, COMPLETED, AVG_DAYS, MAX_DAYS, CURRENT, CURRENT_MAX_DAYS,
             AGREEMENT, AGREEMENT_STATUS, AGREEMENT_TERM, ACTIVITY_KIND, ACTIVITY, PLANNED_VOLUME, ACTUAL_VOLUME,
             VOLUME_UNIT, PLANNED_DATES, ACTUAL_DATES, ACTIVITY_STATUS, WORKS, CONFIRMATIONS, CONFIRMATION_LINKS]
    ReportFilters:
      type: object
      description: >
        An empty list with the include flag false leaves the dimension unfiltered, including rows without a value.
        includeNo* adds rows without the value to the selected ids. managerIds and includeNoManager use the current
        organization owner in PORTFOLIO and DEMAND and the owner snapshot of the event in EVENTS. DEMAND rejects
        productIds, includeNoProduct, stages, workStatuses and flags with 400 VALIDATION_ERROR.
      properties:
        organizationIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        directionIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoDirection:
          type: boolean
        programIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoProgram:
          type: boolean
        productIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoProduct:
          type: boolean
        managerIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        includeNoManager:
          type: boolean
        stages:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 200
        organizationType:
          type: [string, 'null']
          enum: [UNIVERSITY, SCHOOL, COLLEGE, null]
        workStatuses:
          description: Статусы работы (активна, приостановлена, завершена); пустой список не ограничивает отбор
          type: array
          maxItems: 3
          items:
            type: string
            enum: [ACTIVE, PAUSED, COMPLETED]
        flags:
          description: Отметки работы; выбранные отметки должны быть у работы одновременно, пустой список не ограничивает отбор
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/InteractionFlag'
        agreement:
          $ref: '#/components/schemas/ReportAgreementFilters'
        eventTypes:
          type: array
          description: EVENTS only; empty means all kinds including KAM assignments, other kinds reject a non-empty list
          items:
            $ref: '#/components/schemas/ReportEventType'
        minDaysOnStage:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
          description: >
            PORTFOLIO only; keeps interactions whose last entry into the current stage was at least this many days before
            the report is generated, the same rule as DAYS_ON_STAGE and the minDaysOnStage filter of the work list; other
            kinds reject it with 400 VALIDATION_ERROR
    ReportAgreementFilters:
      type: object
      description: >
        Conditions on one and the same product agreement of the interaction (restricted to productIds when they are
        given): vendor, license signed (false means not signed or not specified), license expiry year not later than
        licenseExpiresBy, and no TRANSFERRED mark for each notTransferred kind; an agreement without any marks whose
        stored transferStatus is «Передано» counts as fully transferred. DEMAND rejects any of them with 400.
      properties:
        vendorIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        licenseSigned:
          type: [boolean, 'null']
        licenseExpiresBy:
          type: [integer, 'null']
          minimum: 2000
          maximum: 2100
        notTransferred:
          type: array
          items:
            $ref: '#/components/schemas/ProductTransferKind'
    ReportPreviewRequest:
      type: object
      required: [kind]
      description: from and to are inclusive dates converted to [from 00:00, to+1 00:00) in Europe/Moscow
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        asOf:
          type: [string, 'null']
          format: date
          description: SNAPSHOT only; state at the end of this Moscow day, today when omitted, a future date is rejected
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        filters:
          $ref: '#/components/schemas/ReportFilters'
        columns:
          type: array
          description: >
            Omitted or empty means the default columns of the kind in the default order: for PORTFOLIO all columns
            except the agreement ones (VENDORS, CONTRACT_NUMBER, LICENSE_SIGNED, LICENSE_EXPIRY_YEAR, TRANSFER_STATUS,
            MATERIALS_TRANSFERRED_ON), which are returned only when listed explicitly; for EVENTS and DEMAND all columns
          items:
            $ref: '#/components/schemas/ReportColumn'
        sortBy:
          description: >
            DEMAND only, APPLICATIONS (default), PARTICIPANTS, LEARNERS_COMPLETED or PARALLEL_RUNS; rows are sorted by that measure
            descending with «нет данных» last, then by program name. Other kinds reject it with 400 VALIDATION_ERROR.
          oneOf:
            - $ref: '#/components/schemas/ReportColumn'
            - type: 'null'
    ReportRequest:
      allOf:
        - $ref: '#/components/schemas/ReportPreviewRequest'
        - type: object
          required: [format]
          properties:
            format:
              $ref: '#/components/schemas/ReportFormat'
            groupBy:
              description: >
                Set to order a chart of the statistics grouped this way instead of the row report; columns are ignored
                and format must be PNG or PDF
              oneOf:
                - $ref: '#/components/schemas/StatisticsGroupBy'
                - type: 'null'
            chartType:
              oneOf:
                - $ref: '#/components/schemas/ChartType'
                - type: 'null'
            seriesBy:
              description: Line chart only, with groupBy MONTH; one line per group of this grouping
              oneOf:
                - $ref: '#/components/schemas/StatisticsGroupBy'
                - type: 'null'
    ReportJobCreated:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid
    ReportJob:
      type: object
      required: [id, kind, format, status, progress, resultReady, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ReportKind'
        format:
          $ref: '#/components/schemas/ReportFormat'
        groupBy:
          description: Grouping of a chart job; null for a row report
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
        chartType:
          description: BAR or LINE for a chart job; null for a row report
          oneOf:
            - $ref: '#/components/schemas/ChartType'
            - type: 'null'
        seriesBy:
          description: Grouping of the separate lines of a line chart job; null otherwise
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resultReady:
          type: boolean
        rowCount:
          type: [integer, 'null']
          minimum: 0
        fileName:
          type: [string, 'null']
        error:
          type: object
          required: [code, message]
          description: Present for FAILED jobs, e.g. REPORT_ROW_LIMIT, REPORT_XLS_ROW_LIMIT, REPORT_PDF_ROW_LIMIT, REPORT_CHART_LIMIT, REPORT_ACCESS_CHANGED, REPORT_INTERRUPTED, REPORT_FAILED
          properties:
            code:
              type: string
            message:
              type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    ReportColumnView:
      type: object
      required: [id, title, emptyText]
      properties:
        id:
          $ref: '#/components/schemas/ReportColumn'
        title:
          type: string
        emptyText:
          type: string
          description: >
            Text shown for null values, «Не указано» for direction, program, products and manager, «нет данных» for
            APPLICATIONS, PARTICIPANTS and PARALLEL_RUNS
    ReportPreview:
      type: object
      required: [kind, generatedAt, notes, columns, items, page, size, total]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        generatedAt:
          type: string
          format: date-time
        notes:
          type: array
          description: The same generation time, period rule, manager semantics and filter lines as in the file header
          items:
            type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ReportColumnView'
        items:
          type: array
          description: >
            Row objects keyed by column id; dates are ISO 8601 strings, DEMAND measures and DURATION counts are integers,
            DURATION days are decimal numbers, missing values are null
          items:
            type: object
            additionalProperties:
              type: [string, number, 'null']
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
    StatisticsGroupBy:
      type: string
      description: DEMAND sums applications and accepts ORGANIZATION, DIRECTION, PROGRAM, MANAGER and MONTH (month of submission)
      enum: [STAGE, ORGANIZATION, DIRECTION, PROGRAM, PRODUCT, MANAGER, MONTH]
    StatisticsRequest:
      type: object
      required: [kind, groupBy]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        groupBy:
          $ref: '#/components/schemas/StatisticsGroupBy'
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        filters:
          $ref: '#/components/schemas/ReportFilters'
        asOf:
          type: [string, 'null']
          format: date
        seriesBy:
          description: Only with groupBy MONTH; splits monthly counts into series of this grouping for a line chart
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
    StatisticsSeries:
      type: object
      required: [key, label, unspecified, counts]
      properties:
        key:
          type: string
        label:
          type: string
        unspecified:
          type: boolean
          description: Rows without a value of seriesBy («Не указано»), always the last series
        counts:
          type: array
          description: One count per item of the result, in the same order
          items:
            type: integer
            minimum: 0
    StatisticsItem:
      type: object
      required: [key, label, count]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
          minimum: 0
    StatisticsResult:
      type: object
      required: [kind, groupBy, unit, timezone, generatedAt, filters, notes, total, unknownCount, items, maxChartBars, series,
                 maxChartSeries]
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        groupBy:
          $ref: '#/components/schemas/StatisticsGroupBy'
        unit:
          type: string
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        periodBasis:
          oneOf:
            - $ref: '#/components/schemas/PeriodBasis'
            - type: 'null'
        timezone:
          type: string
        generatedAt:
          type: string
          format: date-time
        filters:
          $ref: '#/components/schemas/ReportFilters'
        notes:
          type: array
          items:
            type: string
        total:
          type: integer
          minimum: 0
          description: >
            Number of report rows; for DEMAND the number of applications. PRODUCT counts may add up to more because one
            interaction can have several products
        unknownCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsItem'
        maxChartBars:
          type: integer
          minimum: 1
          description: >
            Largest number of bars a PNG/PDF chart file can hold, counting the «Не указано» bar of DIRECTION, PROGRAM,
            PRODUCT and MANAGER (and STAGE for EVENTS, where KAM assignments have no stage); a larger chart job fails with
            REPORT_CHART_LIMIT. For a line chart it limits the number of months
        asOf:
          type: [string, 'null']
          format: date
        seriesBy:
          oneOf:
            - $ref: '#/components/schemas/StatisticsGroupBy'
            - type: 'null'
        series:
          type: array
          description: Empty without seriesBy; ordered by total descending with «Не указано» last
          items:
            $ref: '#/components/schemas/StatisticsSeries'
        maxChartSeries:
          type: integer
          minimum: 1
          description: Largest number of lines a PNG/PDF line chart can hold; a job with more lines fails with REPORT_CHART_LIMIT
    SavedReportPeriod:
      type: string
      description: >
        Relative period of a saved report resolved in Europe/Moscow when the list is read: calendar month or quarter
        containing today, or the one before it
      enum: [CURRENT_MONTH, PREVIOUS_MONTH, CURRENT_QUARTER, PREVIOUS_QUARTER]
    SavedReport:
      type: object
      required: [id, name, definition, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        definition:
          description: With a period, from and to hold the dates of that period for the current day
          allOf:
            - $ref: '#/components/schemas/ReportPreviewRequest'
        period:
          oneOf:
            - $ref: '#/components/schemas/SavedReportPeriod'
            - type: 'null'
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SavedReportRequest:
      type: object
      required: [name, definition]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          $ref: '#/components/schemas/ReportPreviewRequest'
        version:
          type: [integer, 'null']
          minimum: 0
          description: Required for update
        period:
          description: >
            Null keeps the from and to of the definition; a relative period replaces them each time the report is opened.
            SNAPSHOT rejects a period with 400 VALIDATION_ERROR (field period): an empty asOf already means today
          oneOf:
            - $ref: '#/components/schemas/SavedReportPeriod'
            - type: 'null'
    ReportManagerOption:
      type: object
      required: [id, displayName, active]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        active:
          type: boolean
    SourceCode:
      type: string
      enum: [WEBSITE, MOODLE]
    SyncRun:
      type: object
      required: [id, source, status, fetchedCount, createdCount, updatedCount, skippedCount, needsMappingCount, failedCount,
                 createdAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceCode'
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        updatedSince:
          type: [string, 'null']
          format: date-time
          description: Watermark sent to the source as updated_since
        fetchedCount:
          type: integer
          minimum: 0
        createdCount:
          type: integer
          minimum: 0
          description: New external records applied; for MOODLE, snapshots published for the first time
        updatedCount:
          type: integer
          minimum: 0
          description: >
            Known external records applied again because the source sent a newer updatedAt; for MOODLE, snapshots whose
            counts changed
        skippedCount:
          type: integer
          minimum: 0
          description: >
            Repeats of an already stored version, Moodle snapshots with unchanged counts and records that are not
            applied by design (withdrawn, unknown type, a group of a course mapped as a whole)
        needsMappingCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        errorCode:
          type: [string, 'null']
          description: >
            For FAILED runs SOURCE_UNAVAILABLE, SOURCE_UNAUTHORIZED, SOURCE_INVALID_RESPONSE, SYNC_INTERRUPTED or
            SYNC_FAILED
        errorMessage:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        trigger:
          $ref: '#/components/schemas/SyncTrigger'
        startedByName:
          type: [string, 'null']
          description: Profile that started the run; for scheduled runs the administrator on whose behalf they run
        organizationName:
          type: [string, 'null']
          description: Organization of a run started from its card
    SyncTrigger:
      type: string
      enum: [MANUAL, SCHEDULE, CARD, BOOTSTRAP]
    RunKind:
      type: string
      description: STUDENTS — classes of learners, counted in reports; TEACHERS — training of university teachers, shown separately and excluded from DEMAND
      enum: [STUDENTS, TEACHERS]
    SyncRunCreated:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
          format: uuid
    DataSource:
      type: object
      required: [source, title, adapterAvailable, configured, proposedContract, problemCount]
      properties:
        source:
          $ref: '#/components/schemas/SourceCode'
        title:
          type: string
        adapterAvailable:
          type: boolean
        configured:
          type: boolean
          description: The deployment configuration sets the base URL of the source (for MOODLE also the token and the allowed courses)
        proposedContract:
          type: boolean
          description: The adapter follows the proposed contract, not a contract confirmed by the customer
        updatedSince:
          type: [string, 'null']
          format: date-time
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        problemCount:
          type: integer
          minimum: 0
          description: Records with status NEEDS_MAPPING or FAILED
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/SyncRun'
            - type: 'null'
        schedule:
          type: [string, 'null']
          description: Spring cron of SOURCES_SYNC_CRON (Moscow time); null when the schedule is off
        nextRunAt:
          type: [string, 'null']
          format: date-time
          description: Next scheduled start; null when the schedule is off, the source is not configured or no administrator started it yet
        stale:
          type: boolean
          description: Configured source without a successful run within SOURCES_STALE_AFTER
    SourceRecord:
      type: object
      required: [id, source, recordType, externalId, externalUpdatedAt, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceCode'
        recordType:
          type: string
          description: >
            partnership_request or learning_application in the proposed site contract; moodle_course or moodle_group
            (externalId courseId or courseId:groupId) for Moodle
        externalId:
          type: string
        externalUpdatedAt:
          type: string
          format: date-time
        externalStatus:
          type: [string, 'null']
        status:
          type: string
          enum: [APPLIED, NEEDS_MAPPING, FAILED, SKIPPED]
        error:
          type: [string, 'null']
        organizationExternalId:
          type: [string, 'null']
        organizationName:
          type: [string, 'null']
          description: Organization name on the site; for Moodle records the course or group label
        programName:
          type: [string, 'null']
        organizationId:
          type: [string, 'null']
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        interactionId:
          type: [string, 'null']
          format: uuid
        updatedAt:
          type: string
          format: date-time
    SourceRecordApply:
      type: object
      properties:
        organizationId:
          type: [string, 'null']
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        runStartsOn:
          type: [string, 'null']
          format: date
          description: First day of the Moodle training run; required for a MOODLE NEEDS_MAPPING record
        runEndsOn:
          type: [string, 'null']
          format: date
          description: Day after the last day of the run (exclusive end); later than runStartsOn
        runKind:
          oneOf:
            - $ref: '#/components/schemas/RunKind'
            - type: 'null'
    SourceRecordApplyResult:
      type: object
      required: [record, reappliedCount]
      properties:
        record:
          $ref: '#/components/schemas/SourceRecord'
        reappliedCount:
          type: integer
          minimum: 0
    LearningSnapshotsRefresh:
      type: object
      required: [run, snapshots]
      properties:
        run:
          $ref: '#/components/schemas/SyncRun'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/LearningSnapshot'
    LearningSnapshot:
      type: object
      required: [mappingId, runKind, courseId, courseName, participants, teachers, unknown, groupsCount, observedAt, changedAt]
      properties:
        mappingId:
          type: string
          format: uuid
          description: Training run (saved mapping) of the snapshot
        runKind:
          $ref: '#/components/schemas/RunKind'
        courseId:
          type: integer
          format: int64
        courseName:
          type: string
        groupId:
          type: [integer, 'null']
          format: int64
          description: Set when a group of a mixed course is mapped on its own
        groupName:
          type: [string, 'null']
        participants:
          type: integer
          minimum: 0
          description: Active enrolments with a learner role (participations, not unique people across courses)
        teachers:
          type: integer
          minimum: 0
        completed:
          type: [integer, 'null']
          minimum: 0
          description: null when course completion is not tracked in Moodle; never replaced by 0
        notCompleted:
          type: [integer, 'null']
          minimum: 0
        unknown:
          type: integer
          minimum: 0
          description: Participants whose completion status Moodle did not report
        groupsCount:
          type: integer
          minimum: 0
          description: Groups of the course that have learners; 0 for a group snapshot
        runStartsOn:
          type: [string, 'null']
          format: date
          description: First day of the confirmed training run; null for a mapping saved without run dates
        runEndsOn:
          type: [string, 'null']
          format: date
          description: Exclusive end of the training run; the snapshot is not updated from this day on
        observedAt:
          type: string
          format: date-time
          description: Time of the last successful observation, not a completion date
        changedAt:
          type: string
          format: date-time
          description: Observation that last changed the counts
    SourceState:
      type: object
      required: [configured, stale]
      properties:
        configured:
          type: boolean
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        errorAt:
          type: [string, 'null']
          format: date-time
          description: Finish of the last run when it failed after the last success
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        stale:
          type: boolean
        dataObservedAt:
          type: [string, 'null']
          format: date-time
          description: For LMS, the latest observation of the card snapshots
    LearningState:
      type: object
