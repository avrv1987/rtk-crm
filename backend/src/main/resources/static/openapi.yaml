    get:
      tags: [Interaction]
      summary: Карточка взаимодействия
      operationId: getInteraction
      x-implementation-stage: 1
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Взаимодействие, видимое через текущую область его организации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrmProfileRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Interaction]
      summary: Изменить план и данные взаимодействия
      operationId: updateInteractionPlan
      x-implementation-stage: 3
      description: >-
        Изменяет план карточки (следующий шаг, срок его выполнения, программу и продукты) и её реквизиты (заголовок, дату последнего контакта, связанные контакты). Отсутствующее свойство сохраняет текущее значение, явный null очищает его; заголовок очистить нельзя. contactIds заменяет связанные контакты; вновь связываемые контакты должны принадлежать организации и не быть неактивными. Удаление продукта, у которого в соглашении уже есть данные договора, отклоняется. Изменение записывает одно событие истории: DETAILS_UPDATED, если изменились заголовок, последний контакт или связанные контакты, иначе PLAN_UPDATED; в комментарии перечислены прежние и новые значения. Добавленные и удалённые контакты хранятся как ссылки и именуются по текущей записи контакта при чтении истории или отчёта, поэтому переименованный или обезличенный контакт никогда не сохраняет прежнее имя в событии. Запрос без эффективных изменений возвращает карточку без изменений.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionPlanUpdate'
      responses:
        '200':
          description: Взаимодействие после обновления плана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ContactInteractionMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
