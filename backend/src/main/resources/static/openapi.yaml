          minimum: 0
        message:
          type: string
    SourcesRefresh:
      type: object
      required: [lms, site, status, snapshots]
      properties:
        lms:
          $ref: '#/components/schemas/RefreshOutcome'
        site:
          $ref: '#/components/schemas/RefreshOutcome'
        status:
          $ref: '#/components/schemas/InteractionSourceStatus'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/LearningSnapshot'
    TeacherTraining:
      type: object
      required: [id, interactionId, eventId, trainedOn, courseName, enrolledCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        interactionId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        trainedOn:
          type: string
          format: date
        courseName:
          type: string
        enrolledCount:
          type: integer
