    post:
      tags: [Enrolment]
      summary: Сформировать файл «Загрузка пользователей» для LMS по потоку
      operationId: exportLmsRoster
      x-implementation-stage: 5
      description: >-
        XLSX по шаблону организатора: Лист1 — 30 заголовков дословно, одна строка на зачисление (одинаковый email у двух
        слушателей строк не убирает), Лист2 и проверки данных «Пол» и «Образование», телефон числом, даты — датами,
        защита от формул. mode PENDING — только зачисления без отметки «передано», ALL — весь поток; incomplete EXCLUDE
        исключает анкеты без Фамилии, Имени, телефона или email, INCLUDE выгружает их с пустыми ячейками. Анкеты
        с ограниченной обработкой и обезличенные не выгружаются. Выгруженным и ещё не переданным зачислениям ставится
        идентификатор выгрузки (заголовок X-Roster-Export-Id). Нет строк — 400. Журнал — LMS_ROSTER_EXPORTED. Ответ
        с Cache-Control no-store, имя файла LMS_<курс>_поток<N>_<дата>.xlsx без персональных данных. Idempotency-Key не
        используется: сохранять файл с анкетами для повтора нельзя, повторный запрос создаёт новую выгрузку.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LmsRosterRequest'
      responses:
        '200':
          description: Файл для LMS
          headers:
            X-Roster-Export-Id:
              schema:
                type: string
                format: uuid
            X-Roster-Rows:
              schema:
                type: integer
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/enrolment/roster-exports/{id}/transferred:
    post:
      tags: [Enrolment]
      summary: Отметить слушателей выгрузки переданными в LMS
      operationId: markRosterExportTransferred
      x-implementation-stage: 5
      description: >-
        Отметка ставится ровно по зачислениям этой выгрузки, ещё не отмеченным (marked = 0 — неотмеченных нет). Журнал —
        LMS_ROSTER_MARKED. Неизвестная выгрузка — 404.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Число отмеченных зачислений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterExportMarked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/enrolment/learners/search:
    post:
      tags: [Enrolment]
      summary: Точный поиск слушателя по email, телефону, СНИЛС или фамилии
      operationId: searchLearners
      x-implementation-stage: 5
      description: >-
        Поиск по отпечаткам HMAC без расшифровки таблицы, только точное совпадение нормализованного значения; до 200
        слушателей. Значение передаётся в теле, чтобы не попасть в адрес и журнал доступа. Журнал — LEARNER_SEARCHED
        (вид поиска и число найденных, без значения). Ответ с Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerSearch'
      responses:
        '200':
          description: Найденные слушатели с масками
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearnerSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/enrolment/learners/{id}:
    get:
      tags: [Enrolment]
      summary: Анкета слушателя с маскированными группами и зачислениями
      operationId: getLearner
      x-implementation-stage: 5
      description: >-
        ФИО и дательный падеж — полностью, телефон и email — частично, группы «Документы», «Личные сведения», «Адрес»,
        «Образование» — маской. Журнал — LEARNER_VIEWED. Ответ с Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Enrolment]
      summary: Изменить поля анкеты слушателя
      operationId: updateLearner
      x-implementation-stage: 5
      description: >-
        fields — только изменяемые поля: код поля → значение, пустая строка или null очищает поле. Даты — ГГГГ-ММ-ДД,
        пол — «М» или «Ж», образование — значение из списка шаблона. Проверки п. 11.8: СНИЛС с контрольным числом,
        паспорт заполняется целиком, дата выдачи паспорта не раньше 14-летия, слушатель не младше 18 лет, телефон,
        email, индекс, даты. Фамилию, имя, телефон и email нельзя очистить. Ошибки — 400 VALIDATION_ERROR, fieldErrors
        по кодам полей без значений; СНИЛС другого слушателя — ошибка поля SNILS, для переноса зачислений —
        POST /api/enrolment/learners/{id}/move-enrolments. Правка с version: 409 VERSION_CONFLICT, анкета
        с ограниченной обработкой — 409 PERSONAL_DATA_RESTRICTED, обезличенная — 409 PERSONAL_DATA_ANONYMIZED. Журнал —
        LEARNER_CHANGED с кодами полей. Ответ — анкета с масками.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerUpdate'
      responses:
        '200':
          description: Анкета после правки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, PERSONAL_DATA_RESTRICTED или PERSONAL_DATA_ANONYMIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/enrolment/learners/{id}/reveal:
    post:
      tags: [Enrolment]
      summary: Показать значения скрытых групп анкеты
      operationId: revealLearnerFields
      x-implementation-stage: 5
      description: >-
        Значения выбранных групп: даты — ГГГГ-ММ-ДД, пол и образование — в написании шаблона. Журнал —
        LEARNER_FIELDS_REVEALED с кодами групп. Анкета с ограниченной обработкой и обезличенная не раскрываются (409).
        Ответ с Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerReveal'
      responses:
        '200':
          description: Значения полей выбранных групп
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRevealed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PERSONAL_DATA_RESTRICTED или PERSONAL_DATA_ANONYMIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/enrolment/learners/{id}/move-enrolments:
    post:
      tags: [Enrolment]
      summary: Перенести зачисления к слушателю с этим СНИЛС
      operationId: moveLearnerEnrolments
      x-implementation-stage: 5
      description: >-
        Исправляет дубль слушателя: зачисления открытой анкеты переходят к слушателю с указанным СНИЛС; зачисление
        в потоке, где он уже зачислен, удаляется (заявка остаётся в учёте спроса); непустые поля открытой анкеты, пустые
        у найденного, переносятся; открытая анкета удаляется. Одна транзакция, журнал — LEARNER_ENROLMENTS_MOVED
        с обоими идентификаторами, числом зачислений и кодами полей. version — версия открытой анкеты.
      parameters:
        - $ref: '#/components/parameters/UuidId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerMove'
      responses:
        '200':
          description: Итог переноса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerMoveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, PERSONAL_DATA_RESTRICTED или PERSONAL_DATA_ANONYMIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/enrolment/learners/{id}/history:
    get:
      tags: [Enrolment]
      summary: История анкеты слушателя без значений
      operationId: getLearnerHistory
      x-implementation-stage: 5
      description: События журнала по анкете (просмотры, раскрытия, изменения с кодами полей, перенос зачислений, функции субъекта ПДн), новые сначала, до 200.
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: События без значений персональных данных
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearnerHistoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: Серверная сессия BFF, созданная входом через GET /api/auth/login. Swagger UI на том же origin использует сессию браузера.
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        enum: [keycloak]
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CatalogLookupState:
      name: state
      in: query
      required: false
      description: Отбор по архиву; форма нового взаимодействия берёт действующие записи, фильтры отчётов — все с отметкой архива
      schema:
        type: string
        enum: [ACTIVE, ARCHIVED, ALL]
        default: ACTIVE
    OrganizationSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['name,asc', 'name,desc', 'updatedAt,asc', 'updatedAt,desc']
        default: 'updatedAt,desc'
    InteractionOrganizationId:
      name: organizationId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    InteractionSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['createdAt,asc', 'createdAt,desc', 'updatedAt,asc', 'updatedAt,desc', 'nextActionAt,asc']
        default: 'updatedAt,desc'
    WorkflowTemplateSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['name,asc', 'name,desc', 'version,asc', 'version,desc']
        default: 'name,asc'
    CrmProfileSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: ['displayName,asc', 'displayName,desc', 'role,asc', 'role,desc', 'accessRevision,asc', 'accessRevision,desc']
        default: 'displayName,asc'
    AgreementConfirmationOrganization:
      name: organizationId
      in: query
      required: false
      description: Видимая организация; скрытая возвращает 404
      schema:
        type: string
        format: uuid
    AgreementConfirmationAgreement:
      name: agreementId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AgreementConfirmationKind:
      name: kindId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AgreementConfirmationFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
    AgreementConfirmationTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Значение token из GET /api/csrf для текущей сессии. Без заголовка или с чужим значением запрос отклоняется с 403 FORBIDDEN.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: Ошибка валидации или формата запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Сессия BFF отсутствует или истекла
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Аутентифицированной личности не разрешено выполнять действие
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CrmProfileRequired:
      description: У личности OIDC нет активного профиля CRM (CRM_PROFILE_REQUIRED), либо её профиль, созданный при первом входе, ожидает активации администратором (CRM_PROFILE_PENDING)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ContactInteractionMutationForbidden:
      description: Видимую организацию или взаимодействие может изменить только активный USER или LEADER её области; область проверяется первой, поэтому скрытый объект — 404. Также возвращается, если у личности OIDC нет активного профиля CRM
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Объект не существует либо находится вне текущей серверной области
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Конфликт version или идемпотентности; VERSION_CONFLICT включает currentVersion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Загружаемые данные превышают настроенный лимит
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Превышен лимит частоты запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DependencyUnavailable:
      description: Обязательная зависимость недоступна
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Непредвиденная ошибка сервера; трассировка стека записывается только в серверный лог под тем же requestId
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ConfirmationLimit:
      description: >
        CONFIRMATION_LIMIT — в выборке более 500 документов, либо, для архива, её файлы CLEAN превышают app.agreements.archive-max-size; сузьте период, вуз или вид
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReportCapacityExceeded:
      description: REPORT_CAPACITY_EXCEEDED — все слоты отчётов и ограниченная очередь заняты; ничего не сохранено
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReportGone:
      description: REPORT_ACCESS_CHANGED после изменения роли, команды или ревизии доступа, либо REPORT_RESULT_UNAVAILABLE, если файл отсутствует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    PaidOrderUpload:
      type: object
      required: [runId, received, emptyElements, created, updated, skipped, needsMapping, failed, message, streams, issues,
                 learners]
      properties:
        runId:
          type: string
          format: uuid
        received:
          type: integer
          minimum: 0
          description: Непустых элементов массива
        emptyElements:
          type: integer
          minimum: 0
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
          description: Заявки, у которых изменились курс или номер потока
        skipped:
          type: integer
          minimum: 0
          description: Заявки без изменений и повторы с тем же содержимым
        needsMapping:
          type: integer
          minimum: 0
          description: Курс не сопоставлен с программой; сопоставляет администратор в разборе источника
        failed:
          type: integer
          minimum: 0
          description: Записи с ошибкой в номере заявки, курсе или номере потока
        message:
          type: [string, 'null']
        streams:
          type: array
          items:
            $ref: '#/components/schemas/PaidOrderStream'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/PaidOrderIssue'
        learners:
          $ref: '#/components/schemas/LearnerIntake'
    PaidOrderStream:
      type: object
      required: [course, streamNo, orders]
      properties:
        course:
          type: string
        streamNo:
          type: integer
          minimum: 1
        orders:
          type: integer
          minimum: 1
    PaidOrderIssue:
      type: object
      required: [position, field, message, warning]
      description: Замечание к элементу массива без значений персональных данных
      properties:
        position:
          type: integer
          minimum: 1
          description: Порядковый номер элемента в массиве с 1
        field:
          type: [string, 'null']
        message:
          type: string
        warning:
          type: boolean
          description: true — запись принята (например, телефон не прошёл проверку и не сохранён)
    LearnerIntake:
      type: object
      required: [newLearners, foundLearners, enrolled, repeatOrders, movedStreams, movedAfterLms, contactsDiffer]
      description: Приём оплат в модуль «Слушатели» — только числа, без персональных данных
      properties:
        newLearners:
          type: integer
          minimum: 0
          description: Созданы новые слушатели
        foundLearners:
          type: integer
          minimum: 0
          description: Найдены существующие слушатели — по заявке или по email или телефону вместе с фамилией и именем
        enrolled:
          type: integer
          minimum: 0
          description: Созданы зачисления
        repeatOrders:
          type: integer
          minimum: 0
          description: Повторные заявки слушателя в потоке, где он уже зачислен; второго зачисления нет
        movedStreams:
          type: integer
          minimum: 0
          description: Зачисления перенесены в другой поток после смены курса или номера потока в заявке
        movedAfterLms:
          type: integer
          minimum: 0
          description: Из них уже выгружались для LMS; отметки сняты, из прежнего потока в LMS исключить вручную
        contactsDiffer:
          type: integer
          minimum: 0
          description: Телефон или email в оплате отличаются от анкеты; анкета не перезаписана
    LearnerFieldCode:
      type: string
      description: Код поля анкеты в порядке колонок A…AD шаблона «Загрузка пользователей»
      enum: [LAST_NAME, FIRST_NAME, MIDDLE_NAME, PHONE, EMAIL, SNILS, PASSPORT_SERIES, PASSPORT_NUMBER, PASSPORT_ISSUED_BY,
             PASSPORT_ISSUE_DATE, PASSPORT_DIVISION_CODE, GENDER, BIRTH_DATE, REGION, LOCALITY, STREET, HOUSE, APARTMENT,
             POSTAL_CODE, FIRST_NAME_DATIVE, LAST_NAME_DATIVE, MIDDLE_NAME_DATIVE, EDUCATION, DIPLOMA_PROFESSION,
             DIPLOMA_INSTITUTION, DIPLOMA_LAST_NAME, DIPLOMA_NUMBER, DIPLOMA_SERIES, DIPLOMA_REGISTRATION_NUMBER,
             DIPLOMA_ISSUE_DATE]
    LearnerFieldGroup:
      type: string
      description: >-
        MAIN основное (ФИО, телефон, email), DOCUMENTS документы (СНИЛС и паспорт), PERSONAL личные сведения (пол, дата
        рождения), ADDRESS адрес регистрации, DATIVE ФИО в дательном падеже, EDUCATION образование и диплом
      enum: [MAIN, DOCUMENTS, PERSONAL, ADDRESS, DATIVE, EDUCATION]
    LmsStatus:
      type: string
      description: PENDING ожидает выгрузки, EXPORTED выгружено в файл, TRANSFERRED передано в LMS
      enum: [PENDING, EXPORTED, TRANSFERRED]
    EnrolmentStreams:
      type: object
      required: [streams, counters]
      properties:
        streams:
          type: array
          items:
            $ref: '#/components/schemas/EnrolmentStream'
        counters:
