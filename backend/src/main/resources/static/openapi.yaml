        Только ADMIN. Сохраняет запуск со статусом PENDING и передаёт его в ограниченный исполнитель синхронизации (не поток HTTP); возвращает 202 с runId. На источник существует не более одного запуска PENDING или RUNNING: повторный запуск получает 409 SYNC_ALREADY_RUNNING. Повтор синхронизации безопасен: запись сайта с тем же source, type, externalId и updatedAt пропускается, а снимок Moodle с неизменившимися счётчиками получает только новое время наблюдения. Ошибка источника завершает запуск неудачей и оставляет сохранённые записи, опубликованные снимки Moodle, числа спроса и отметку updated_since без изменений. Те же запуски запускаются по серверному расписанию SOURCES_SYNC_CRON от имени активного администратора, который запускал последний запуск источника; источник, который ещё никто не запускал, по расписанию не запускается.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SourceCode'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Запуск синхронизации принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >
            SOURCE_NOT_CONFIGURED, если SITE_BASE_URL пуст, либо MOODLE_BASE_URL, MOODLE_TOKEN или MOODLE_COURSE_IDS пусты; SYNC_ALREADY_RUNNING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: SYNC_CAPACITY_EXCEEDED — исполнитель синхронизации и его очередь заняты; ничего не сохранено
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
