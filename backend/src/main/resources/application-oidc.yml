spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: crm-bff
            client-secret: ${app.oidc.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/callback/{registrationId}"
            scope: openid,profile
        provider:
          keycloak:
            authorization-uri: ${app.oidc.public-base-url}/idp/realms/rtk-crm/protocol/openid-connect/auth
            token-uri: ${app.oidc.internal-base-url}/realms/rtk-crm/protocol/openid-connect/token
            user-info-uri: ${app.oidc.internal-base-url}/realms/rtk-crm/protocol/openid-connect/userinfo
            jwk-set-uri: ${app.oidc.internal-base-url}/realms/rtk-crm/protocol/openid-connect/certs
            user-name-attribute: preferred_username
app:
  oidc:
    end-session-uri: ${app.oidc.issuer-uri}/protocol/openid-connect/logout
    post-logout-redirect-uri: ${app.oidc.public-base-url}/
