spring:
  application:
    name: rtk-crm
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
      table-name: spring_session
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  forward-headers-strategy: framework
  tomcat:
    # Заголовок части multipart по умолчанию 512 байт: длинное кириллическое имя файла (около 250 символов) не помещалось,
    # и Tomcat отвечал 413 «файл слишком большой» на файл в сотню байт. Имя ограничено 255 символами при проверке файла.
    max-part-header-size: 8KB
  servlet:
    session:
      timeout: ${APP_SESSION_IDLE_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    path: /swagger-ui
    url: /openapi.yaml
    validator-url: none
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
app:
  session:
    absolute-timeout: ${APP_SESSION_ABSOLUTE_TIMEOUT:12h}
  # Ограничение частоты /api/** (ApiRateLimitFilter): запросов в минуту на вошедшего пользователя и на адрес
  # для запросов без входа; 0 выключает. Запас под нагрузочный тест — в технической документации.
  api-rate-limit:
    per-minute: ${API_RATE_LIMIT_PER_MINUTE:1800}
    anonymous-per-minute: ${API_RATE_LIMIT_ANONYMOUS_PER_MINUTE:600}
  modules:
    enrolment:
      enabled: ${MODULE_ENROLMENT_ENABLED:true}
    partner:
      enabled: ${MODULE_PARTNER_ENABLED:true}
    max:
      enabled: ${MAX_ENABLED:false}
    # Модуль почты (docs/mail.md): без флага письма не ставятся и не уходят, /api/mail/* отвечает 404.
    mail:
      enabled: ${MAIL_ENABLED:false}
  attachments:
    storage-root: ${APP_ATTACHMENTS_STORAGE_ROOT:/var/lib/rtk-crm/files}
    scanner-host: ${APP_ATTACHMENTS_SCANNER_HOST:localhost}
    scanner-port: ${APP_ATTACHMENTS_SCANNER_PORT:3310}
    scanner-connect-timeout: ${APP_ATTACHMENTS_SCANNER_CONNECT_TIMEOUT:2s}
    scanner-read-timeout: ${APP_ATTACHMENTS_SCANNER_READ_TIMEOUT:20s}
    max-file-size: 20MB
  organizations:
    manager-creation-requires-approval: ${APP_ORGANIZATIONS_MANAGER_CREATION_REQUIRES_APPROVAL:true}
  agreements:
    archive-max-size: 1GB
    signing-stage-rule: ${APP_AGREEMENTS_SIGNING_STAGE_RULE:true}
    exchange-stage-names: Обмен документами
    correction-stage-names: Корректировка документов
    approval:
      university-first-round-days: ${APP_AGREEMENTS_APPROVAL_UNIVERSITY_FIRST_ROUND_DAYS:42}
      university-next-round-days: ${APP_AGREEMENTS_APPROVAL_UNIVERSITY_NEXT_ROUND_DAYS:21}
      school-days: ${APP_AGREEMENTS_APPROVAL_SCHOOL_DAYS:7}
      total-yellow-days: ${APP_AGREEMENTS_APPROVAL_TOTAL_YELLOW_DAYS:60}
      total-red-days: ${APP_AGREEMENTS_APPROVAL_TOTAL_RED_DAYS:90}
      excluded-months: ${APP_AGREEMENTS_APPROVAL_EXCLUDED_MONTHS:7,8}
  reports:
    storage-root: ${APP_REPORTS_STORAGE_ROOT:/var/lib/rtk-crm/reports}
    slots: 10
    queue-capacity: 40
    max-rows: 50000
    max-pdf-rows: 20000
  sources:
    slots: 1
    queue-capacity: 1
    sync-cron: ${APP_SOURCES_SYNC_CRON:-}
    stale-after: ${APP_SOURCES_STALE_AFTER:26h}
    settings-key: ${APP_SOURCES_SETTINGS_KEY:}
    website:
      base-url: ${APP_SOURCES_WEBSITE_BASE_URL:}
      token: ${APP_SOURCES_WEBSITE_TOKEN:}
      connect-timeout: 5s
      read-timeout: 20s
      max-pages: 100
      max-page-size: 5MB
    moodle:
      base-url: ${APP_SOURCES_MOODLE_BASE_URL:}
      token: ${APP_SOURCES_MOODLE_TOKEN:}
      course-ids: ${APP_SOURCES_MOODLE_COURSE_IDS:}
      student-roles: student
      teacher-roles: editingteacher,teacher
      teacher-course-label: ППС
      connect-timeout: 5s
      read-timeout: 20s
      max-response-size: 5MB
    crm:
      base-url: ${APP_SOURCES_CRM_BASE_URL:}
      token: ${APP_SOURCES_CRM_TOKEN:}
      connect-timeout: 5s
      read-timeout: 20s
      max-pages: 100
      max-page-size: 5MB
  moodle-write:
    enabled: ${MOODLE_WRITE_ENABLED:false}
    token: ${MOODLE_WRITE_TOKEN:}
    student-role-id: ${MOODLE_STUDENT_ROLE_ID:5}
  labor-market:
    base-url: ${APP_LABOR_MARKET_BASE_URL:}
    token: ${APP_LABOR_MARKET_TOKEN:}
    connect-timeout: 5s
    read-timeout: 20s
    max-response-size: 5MB
    max-items: 5000
    history-months: 24
  retention:
    cron: ${APP_RETENTION_CRON:0 30 3 * * *}
    report-files: ${APP_RETENTION_REPORT_FILES:7d}
    inactive-contacts: ${APP_RETENTION_INACTIVE_CONTACTS:1095d}
    dismissed-profiles: ${APP_RETENTION_DISMISSED_PROFILES:365d}
    audit-events: ${APP_RETENTION_AUDIT_EVENTS:1095d}
    agent-plans: ${APP_RETENTION_AGENT_PLANS:30d}
    learner-profiles: ${APP_RETENTION_LEARNER_PROFILES:P3Y}
  account-sync:
    base-url: ${APP_OIDC_INTERNAL_BASE_URL:}
    realm: rtk-crm
    client-id: crm-account-sync
    client-secret: ${APP_KEYCLOAK_ACCOUNT_SYNC_CLIENT_SECRET:}
    timeout: 15s
  work:
    stuck-days: 30
    upcoming-days: 7
    license-years-ahead: 1
    training-cycle-years: 3
    training-notice-days: 90
    reminder-list-limit: 50
    qualification-after-months: 12
    agreement-notice-days: 90
    deputy-expiry-delay: PT5M
  lms-signals:
    no-students-after-days: 14
    low-completion-percent: 50
    completion-coverage-percent: 70
    completion-window-days: 7
    activity-grace-days: 7
    low-activity-percent: 40
    not-started-percent: 50
    dropout-percent: 25
    inactive-after-days: 14
    stale-after: ${app.sources.stale-after}
  enrolment:
    active-key-version: ${APP_ENROLMENT_ACTIVE_KEY_VERSION:}
    keys:
      v1: ${APP_ENROLMENT_KEYS_V1:}
    fingerprint-key: ${APP_ENROLMENT_FINGERPRINT_KEY:}
  # MCP для ИИ-агентов (docs/mcp.md). Выключен по умолчанию: без флага /mcp не регистрируется и отвечает 404.
  mcp:
    enabled: ${MCP_ENABLED:false}
    audience: crm-mcp
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
    calls-per-minute: ${MCP_CALLS_PER_MINUTE:60}
    list-limit: 25
    event-limit: 10
    history-days: 90
    # Запись — только планом: агент готовит, сотрудник подтверждает на экране CRM. Scope записи клиент просит отдельно.
    write-scope: crm-mcp.write
    plan-ttl: 20m
    plan-pending-limit: 5
    plan-daily-limit: 30
    # Режим ПДн по клиенту MCP (azp токена): masked — по умолчанию, none — имена и контакты людей вуза скрыты.
    # Пример: clients.<azp>.pd-mode: none. Режим выбирают операторы при регистрации клиента.
    clients: {}
  oidc:
    issuer-uri: ${APP_OIDC_ISSUER_URI:}
    public-base-url: ${APP_OIDC_PUBLIC_BASE_URL:}
    internal-base-url: ${APP_OIDC_INTERNAL_BASE_URL:}
    client-secret: ${APP_OIDC_CLIENT_SECRET:}
  max:
    api-base-url: https://platform-api2.max.ru
    public-base-url: ${MAX_PUBLIC_BASE_URL:${app.oidc.public-base-url:}}
    bot-token: ${MAX_BOT_TOKEN:}
    trust-dir: ${MAX_TRUST_DIR:/etc/rtk-crm/max}
    connect-timeout: 5s
    read-timeout: 10s
    link-code-ttl: 10m
    init-data-max-age: 1h
    session-idle: 30m
    session-lifetime: 4h
    message-ttl: 24h
    quiet-before-hour: 9
    quiet-after-hour: 20
    jobs-enabled: true
    inbox-delay: PT5S
    sender-delay: PT10S
    collector-delay: PT5M
    watch-delay: PT1H
    digest-cron: ${MAX_DIGEST_CRON:0 0 9 * * MON-FRI}
    retention-cron: ${MAX_RETENTION_CRON:0 45 3 * * *}
    inbox-retention: 7d
    outbox-retention: 30d
  # Почта: сервер, режим и отправитель задаются в «Администрировании → Почта»; здесь — адрес CRM для ссылок и расписание.
  mail:
    public-base-url: ${MAIL_PUBLIC_BASE_URL:${app.oidc.public-base-url:}}
    jobs-enabled: true
    message-ttl: 48h
    invitation-ttl: 72h
    retention: 30d
    connect-timeout: 10s
    sender-delay: PT30S
    collector-delay: PT5M
    digest-cron: ${MAIL_DIGEST_CRON:0 0 9 * * MON-FRI}
    weekly-cron: ${MAIL_WEEKLY_CRON:0 5 9 * * MON}
    retention-cron: ${MAIL_RETENTION_CRON:0 50 3 * * *}
